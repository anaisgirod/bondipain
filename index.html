<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bondipain | Pain artisanal livré à Moka</title>
  <link rel="icon" type="image/png" id="favicon" href="./logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    :root {
      --brand:        #F2A24C;
      --brand-strong: #E5892B;
      --brand-deep:   #C9711B;
      --brand-soft:   #FBE5CC;
      --cream:        #FFF8F1;
      --cream-2:      #FDF1E5;
      --ink:          #2A2622;
      --muted:        #837A70;
      --line:         #EFE3D5;
      --green-ok:     #2E7D52;
      --danger:       #C0392B;
      --shadow-sm:    0 2px 10px rgba(60,40,15,.08);
      --shadow-md:    0 8px 30px rgba(60,40,15,.12);
      --radius:       16px;
    }
    body {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      background: var(--cream);
      color: var(--ink);
      overflow-x: hidden;
      line-height: 1.5;
    }
    h1,h2,h3,h4 { font-family: 'Rubik', sans-serif; line-height: 1.1; }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 22px; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 15px;
      padding: 12px 22px; border-radius: 999px; transition: all .18s ease; white-space: nowrap;
    }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--brand-strong); transform: translateY(-1px); }
    .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    .btn-ghost:hover { border-color: var(--brand); color: var(--brand-deep); }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── TOP UTILITY BAR ── */
    .topbar { background: var(--brand); color: #fff; font-size: 18px; font-weight: 800; }
    .topbar .container { display: flex; align-items: center; justify-content: center; position: relative; min-height: 54px; gap: 10px; text-align: center; }
    .topbar .promo { display:flex; align-items:center; gap:8px; }
    .lang-switch { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; background: rgba(255,255,255,.22); border-radius: 999px; padding: 3px; }
    .lang-switch button { color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; opacity: .8; }
    .lang-switch button.active { background: #fff; color: var(--brand-deep); opacity: 1; }

    /* ── HEADER ── */
    header.site { position: sticky; top: 0; z-index: 50; background: var(--cream); border-bottom: 1px solid var(--line); transition: box-shadow .2s; }
    header.site.scrolled { box-shadow: var(--shadow-sm); }
    .nav { display: flex; align-items: center; justify-content: space-between; min-height: 74px; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { height: 46px; width: auto; }
    .brand .name { font-family: 'Rubik'; font-weight: 800; font-size: 22px; color: var(--brand-deep); letter-spacing: -.5px; }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { font-family: 'Rubik'; font-weight: 500; font-size: 15px; color: var(--ink); position: relative; }
    .nav-links a:hover { color: var(--brand-deep); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1.5px solid var(--line); transition: border-color .15s; }
    .icon-btn:hover { border-color: var(--brand); }
    .icon-btn svg { width: 21px; height: 21px; stroke: var(--ink); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item .icon-lbl { font-family: 'Rubik'; font-weight: 600; font-size: 11px; color: var(--muted); line-height: 1; }
    .nav-item:hover .icon-lbl { color: var(--brand-deep); }
    .cart-count { position: absolute; top: -5px; right: -5px; background: var(--brand-deep); color: #fff; font-size: 11px; font-weight: 800; font-family: 'Rubik'; min-width: 19px; height: 19px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; }
    .menu-toggle { display: none; }

    /* ── HERO ── */
    .hero { position: relative; min-height: 520px; display: grid; place-items: center; text-align: center; color: #fff; overflow: hidden; }
    .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,18,5,.35) 0%, rgba(30,18,5,.55) 100%); z-index: 1; }
    .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.4s ease-in-out; }
    .hero-bg img.active { opacity: 1; }
    .hero-dots { position: absolute; bottom: 18px; left: 0; right: 0; z-index: 3; display: flex; justify-content: center; gap: 9px; }
    .hero-dots button { width: 11px; height: 11px; border-radius: 50%; border: none; background: rgba(255,255,255,.5); cursor: pointer; padding: 0; transition: all .2s; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .hero-dots button.active { background: #fff; width: 26px; border-radius: 999px; }
    .hero-content { position: relative; z-index: 2; padding: 60px 20px; max-width: 760px; }
    .hero .eyebrow { font-family: 'Caveat'; font-size: clamp(38px, 6vw, 52px); color: var(--brand); font-weight: 700; }
    .hero h1 { font-size: clamp(44px, 8vw, 92px); font-weight: 900; letter-spacing: -2px; text-shadow: 0 4px 24px rgba(0,0,0,.4); }
    .hero p.sub { font-size: 19px; margin: 14px auto 28px; max-width: 520px; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
    .hero .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .hero-preview { margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .hero-preview .hp-label { font-size: 14px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; opacity: .9; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .hero-preview .hp-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .hero-preview .hp-chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(4px); color: #fff; font-size: 13.5px; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: all .15s; }
    .hero-preview .hp-chip:hover { background: var(--brand); border-color: var(--brand); }

    /* ── INFO STRIP ── */
    .info-strip { background: var(--ink); color: #fff; padding: 24px 0; }
    .info-strip .container { display: flex; align-items: center; justify-content: center; gap: 16px; text-align: center; font-size: 18px; font-weight: 700; }
    .info-strip svg { width: 32px; height: 32px; stroke: var(--brand); flex-shrink: 0; }

    /* ── SECTION HEADINGS ── */
    section.block { padding: 72px 0; }
    .section-head { text-align: center; max-width: 620px; margin: 0 auto 46px; }
    .section-head .eyebrow { font-family: 'Caveat'; font-size: 26px; color: var(--brand-deep); font-weight: 700; }
    .section-head h2 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -1px; margin-top: 2px; }
    .section-head p { color: var(--muted); margin-top: 12px; font-size: 16px; }

    /* ── MENU CARDS ── */
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
    .card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .card .ph { position: relative; aspect-ratio: 4/3; overflow: hidden; }
    .card .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .card:hover .ph img { transform: scale(1.05); }
    .card .tag { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.95); color: var(--brand-deep); font-family: 'Rubik'; font-weight: 700; font-size: 12px; padding: 5px 12px; border-radius: 999px; }
    .card .body { padding: 20px 20px 22px; display: flex; flex-direction: column; flex: 1; }
    .card h3 { font-size: 22px; font-weight: 700; }
    .card .desc { color: var(--muted); font-size: 14.5px; margin: 8px 0 16px; flex: 1; }
    .card .price-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card .price { font-family: 'Rubik'; font-weight: 800; font-size: 22px; color: var(--ink); }
    .card .avail { font-size: 12.5px; color: var(--muted); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .card .avail .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-ok); }

    /* ── ABOUT ── */
    .about { background: var(--cream-2); }
    .about-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 50px; align-items: center; }
    .about-grid img { border-radius: var(--radius); box-shadow: var(--shadow-md); aspect-ratio: 4/3; object-fit: cover; width: 100%; }
    .about-text h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -1px; }
    .about-text .eyebrow { font-family: 'Caveat'; font-size: 26px; color: var(--brand-deep); font-weight: 700; }
    .about-text p { color: var(--muted); margin-top: 14px; font-size: 16px; }
    .feature-list { list-style: none; margin-top: 22px; display: grid; gap: 14px; }
    .feature-list li { display: flex; gap: 12px; align-items: flex-start; font-weight: 500; }
    .feature-list svg { width: 24px; height: 24px; stroke: var(--brand-deep); flex-shrink: 0; margin-top: 1px; }

    /* ── STEPS (infographie animée) ── */
    .steps-infog { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; position: relative; margin-top: 56px; }
    .steps-infog::before { content:""; position:absolute; top:56px; left:12.5%; right:12.5%; height:3px; z-index:0;
      background-image: linear-gradient(90deg, var(--brand-deep) 45%, transparent 45%);
      background-size: 16px 3px; opacity:.5; animation: dashmove 1.2s linear infinite; }
    @keyframes dashmove { to { background-position: 16px 0; } }
    .step-inf { display:flex; flex-direction:column; align-items:center; text-align:center; padding: 0 16px 32px; position:relative; z-index:1; }
    .step-inf .si-icon { width:112px; height:112px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:20px;
      box-shadow:0 10px 26px rgba(60,40,15,.14); animation: bob 3s ease-in-out infinite; transition: transform .25s; }
    .step-inf:nth-child(2) .si-icon { animation-delay:.4s; }
    .step-inf:nth-child(3) .si-icon { animation-delay:.8s; }
    .step-inf:nth-child(4) .si-icon { animation-delay:1.2s; }
    .step-inf .si-icon:hover { transform: scale(1.08) rotate(-3deg); animation-play-state: paused; }
    @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-9px); } }
    .step-inf .si-icon svg { width:112px; height:112px; display:block; }
    .step-inf .si-num { position:absolute; top:-6px; right:calc(50% - 58px); background:var(--brand-deep); color:#fff; font-family:'Rubik'; font-weight:800; font-size:13px; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid #fff; box-shadow:0 3px 8px rgba(60,40,15,.2); z-index:2; }
    .step-inf h4 { font-family:'Rubik'; font-weight:800; font-size:16.5px; margin-bottom:6px; }
    .step-inf p { color:var(--muted); font-size:13.5px; line-height:1.45; }
    @media(max-width:640px){ .steps-infog { grid-template-columns:1fr 1fr; row-gap:12px; } .steps-infog::before { display:none; } }

    /* ── CONTACT ── */
    .contact { background: var(--ink); color: #fff; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .contact h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
    .contact .eyebrow { font-family: 'Caveat'; font-size: 26px; color: var(--brand); font-weight: 700; }
    .contact p { color: #d8cfc4; margin-top: 12px; }
    .contact-info { display: grid; gap: 16px; margin-top: 8px; }
    .contact-info .row { display: flex; gap: 14px; align-items: center; }
    .contact-info svg { width: 24px; height: 24px; stroke: var(--brand); flex-shrink: 0; }
    .contact-info b { font-family: 'Rubik'; }
    .contact-info span { display: block; color: #c9bfb4; font-size: 14px; }

    /* ── FOOTER ── */
    footer.site { background: #1B1814; color: #cbbfb2; padding: 44px 0 28px; font-size: 14px; }
    .foot-grid { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .foot-grid .brand .name { color: #fff; }
    footer.site .legal { width: 100%; border-top: 1px solid rgba(255,255,255,.1); margin-top: 28px; padding-top: 18px; text-align: center; color: #8c8175; font-size: 13px; }
    .news-form { width: 100%; max-width: 460px; }
    .news-form .news-title { font-family: 'Rubik'; font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 10px; }
    .news-form .news-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .news-form input { flex: 1; min-width: 180px; padding: 11px 14px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-family: inherit; font-size: 14px; }
    .news-form input::placeholder { color: #a99d8f; }
    .news-form input:focus { outline: none; border-color: var(--brand); }
    .news-form .news-msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
    .news-form .news-msg.ok { color: #7BD49A; }
    .news-form .news-msg.err { color: #F0A58C; }

    /* ── MODAL / DRAWER SYSTEM ── */
    .overlay { position: fixed; inset: 0; background: rgba(25,15,5,.5); backdrop-filter: blur(2px); z-index: 100; opacity: 0; visibility: hidden; transition: opacity .25s; }
    .overlay.open { opacity: 1; visibility: visible; }

    .modal { position: fixed; z-index: 110; left: 50%; top: 50%; transform: translate(-50%, -46%); width: min(560px, 94vw); max-height: 90vh; overflow-y: auto; background: var(--cream); border-radius: 20px; box-shadow: var(--shadow-md); opacity: 0; visibility: hidden; transition: all .25s; }
    .modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
    .modal-head { position: sticky; top: 0; background: var(--cream); padding: 20px 24px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); z-index: 2; }
    .modal-head h3 { font-size: 22px; font-weight: 800; }
    .modal-close { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1.5px solid var(--line); display: grid; place-items: center; }
    .modal-close svg { width: 18px; height: 18px; stroke: var(--ink); }
    .modal-back { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px 7px 11px; font-family: 'Rubik'; font-weight: 700; font-size: 13px; color: var(--ink); cursor: pointer; transition: all .15s; }
    .modal-back:hover { border-color: var(--brand); color: var(--brand-deep); }
    .modal-back svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; }
    .head-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .head-left h3 { overflow: hidden; text-overflow: ellipsis; }
    .modal-body { padding: 22px 24px; }
    .modal-foot { position: sticky; bottom: 0; background: var(--cream); padding: 16px 24px; border-top: 1px solid var(--line); }

    /* drawer (cart) */
    .drawer { position: fixed; z-index: 110; top: 0; right: 0; height: 100%; width: min(440px, 100vw); background: var(--cream); box-shadow: var(--shadow-md); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s ease; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .drawer-head h3 { font-size: 21px; font-weight: 800; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .drawer-foot { padding: 18px 22px; border-top: 1px solid var(--line); background: var(--cream-2); }

    /* product modal pieces */
    .opt-group { margin-bottom: 22px; }
    .opt-group > label.gl { font-family: 'Rubik'; font-weight: 700; font-size: 15px; display: block; margin-bottom: 4px; }
    .opt-group .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 9px; }
    .cond-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 9px; cursor: pointer; }
    .cond-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand-strong); flex-shrink: 0; }
    .opt-ic { font-size: 20px; width: 38px; height: 38px; display: inline-grid; place-items: center; background: var(--cream-2); border-radius: 10px; flex-shrink: 0; line-height: 1; }
    .cond-row .label { flex: 1; font-weight: 600; }
    .cond-row .op { font-size: 13px; font-weight: 700; }
    .opt-row .label { font-weight: 600; }
    .opt-row .op { color: var(--muted); font-size: 13.5px; font-weight: 600; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper button { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-deep); font-weight: 800; font-size: 18px; display: grid; place-items: center; line-height: 1; }
    .stepper button:hover { background: var(--brand); color: #fff; }
    .stepper .q { min-width: 18px; text-align: center; font-family: 'Rubik'; font-weight: 700; }
    .item-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .item-opt { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; transition: all .15s; }
    .item-opt:hover { border-color: var(--brand); }
    .item-opt.selected { border-color: var(--brand); background: var(--brand-soft); }
    .item-opt input[type=radio], .item-opt input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand-strong); flex-shrink: 0; }
    .item-opt .it-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .item-opt .it { flex: 1; font-weight: 600; }
    .item-opt .item-qty { flex-shrink: 0; }
    .stepper.sm { gap: 8px; }
    .stepper.sm button { width: 26px; height: 26px; font-size: 16px; }
    .item-opt .it-clickable { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .item-opt .it-clickable:hover { color: var(--brand-deep); text-decoration-color: var(--brand); }
    .item-opt .ip { font-family: 'Rubik'; font-weight: 800; color: var(--brand-deep); font-size: 14px; }

    /* cart line */
    .cart-line { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .cart-line img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .cart-line .ci-main { flex: 1; min-width: 0; }
    .cart-line .ci-title { font-family: 'Rubik'; font-weight: 700; font-size: 15.5px; }
    .cart-line .ci-extras { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .cart-day-group { margin-bottom: 6px; }
    .cart-day-head { font-family: 'Rubik'; font-weight: 800; font-size: 14px; color: var(--brand-deep); padding: 12px 0 4px; border-bottom: 2px solid var(--brand-soft); margin-bottom: 4px; }
    .cart-line .ci-day { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .cart-line .ci-day-lbl { font-size: 12.5px; font-weight: 700; color: var(--brand-deep); }
    .cart-line .ci-day-sel { font-family: inherit; font-size: 13px; font-weight: 600; padding: 5px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--cream-2); color: var(--ink); cursor: pointer; }
    .ci-day-sel.needs-day { border-color: var(--brand); background: #FFF6EA; color: var(--brand-deep); }
    .cart-line .ci-day-none { font-size: 12.5px; font-weight: 700; color: var(--danger); margin-top: 8px; }
    .cart-line .ci-bottom { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
    .cart-line .ci-price { font-family: 'Rubik'; font-weight: 800; margin-right: auto; }
    .cart-line .ci-edit { color: var(--brand-deep); font-size: 12.5px; font-weight: 700; }
    .cart-line .ci-edit:hover { text-decoration: underline; }
    .cart-line .ci-remove { color: var(--danger); font-size: 12.5px; font-weight: 600; }

  async function loadDailyMenu() {
    if (!_supa) return;
    const { data, error } = await _supa.from("daily_menu").select("*");
    if (error || !data) return;
    // veg avant nonveg pour un affichage stable

    const byWeek = {};
    data.forEach(r => {
      const wk = r.week || "0000-00-00"; // lignes historiques sans semaine → base reportée
      ((byWeek[wk] = byWeek[wk] || {})[r.day] = byWeek[wk][r.day] || []).push(r);
    });
    DAILY_MENU = byWeek;
    DAILY_WEEKS = Object.keys(byWeek).sort();
    dailyLoaded = true;
  }
  function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
  function weekKeyForShift(shift) { return ymd(weekMenuDate(1, shift)); }            // lundi de la semaine (décalage)
  function mondayKeyOfDate(dt) { const off = dt.getDay()===0 ? -6 : 1-dt.getDay(); return ymd(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+off)); }
  function shiftForWeekKey(key) {
    const cur = weekMenuDate(1, 0);
    const [y,m,d] = key.split("-").map(Number);
    return Math.round((new Date(y, m-1, d) - new Date(cur.getFullYear(), cur.getMonth(), cur.getDate())) / (7*86400000));
  }
  function defaultWeekShift() { return WEEK_OPTIONS.find(w => DAY_DEFS.some(d => isDateOrderable(weekMenuDate(d.wd, w)))) ?? 0; }
  // Menu d'une semaine (clé lundi) avec REPORT : on prend la dernière semaine renseignée ≤ cible.
  function menuForWeekKey(key) {
    if (DAILY_MENU[key]) return DAILY_MENU[key];
    let best = null;
    for (const w of DAILY_WEEKS) { if (w <= key) best = w; }
    if (best) return DAILY_MENU[best];
    return DAILY_WEEKS.length ? DAILY_MENU[DAILY_WEEKS[0]] : {};
  }
  function menuForWeek(shift) { return menuForWeekKey(weekKeyForShift(shift)); }

    const btn = $("#newsForm button");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.className = "news-msg err"; msg.textContent = t("news_bad"); return false; }
    btn.disabled = true;
    try {
      const res = await fetch("/api/newsletter-subscribe", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, lang }),
      });
      if (!res.ok) throw new Error();
      msg.className = "news-msg ok"; msg.textContent = t("news_ok");
      $("#newsEmail").value = "";
    } catch (e) {
      msg.className = "news-msg err"; msg.textContent = t("news_err");
    } finally { btn.disabled = false; }
    return false;
  }

  let weekView = null; // index de semaine affiché (0 = cette semaine, 1 = +1, 2 = +2)
  const WEEK_OPTIONS = [0, 1, 2]; // jusqu'à 2 semaines à l'avance
  function mondayLabel(weekIndex) {
    const d = weekMenuDate(1, weekIndex); // lundi de la semaine
    return `${lang==="fr"?"Semaine du":"Week of"} ${d.getDate()} ${t("months")[d.getMonth()]} ${d.getFullYear()}`;

    const el = $("#weekGrid");

      el.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px;">${lang==="fr"?"Chargement du menu…":"Loading menu…"}</div>`;

  /* ============================================================
     MENU DU JOUR (hebdomadaire)
  ============================================================ */
  function findDishCat(id) {
    for (const c of CATEGORIES) { const it = c.items.find(i => i.id === id); if (it) return { catId: c.id, item: it, fridayOnly: !!c.fridayOnly }; }
    return null;
  }

  // Grille Lun→Ven (depuis daily_menu) : jours commandables (cutoff Maurice) cliquables, autres grisés.
  // Date d'un jour (Lun–Ven) pour la semaine affichée dans le menu de la semaine.
  // On reste sur la semaine en cours ; si plus aucun jour n'y est commandable
  // (week-end / fin de semaine), on bascule sur la semaine suivante.
  function weekMenuDate(wd, weekShift) {
    const mt = mtNow();
    const dow = mt.getDay(); // 0 = dimanche … 6 = samedi
    const mondayOffset = (dow === 0 ? -6 : 1 - dow); // décalage vers le lundi de cette semaine
    return new Date(mt.getFullYear(), mt.getMonth(), mt.getDate() + mondayOffset + weekShift * 7 + (wd - 1), 11, 0, 0, 0);
  }
  function weekGridHtml(weekShift) {
    if (weekShift == null) weekShift = defaultWeekShift();
    const menu = menuForWeek(weekShift);
    const mt = mtNow();
    const todayStr = mt.toDateString();
    return DAY_DEFS.map(d => {
      const items = menu[d.key] || [];
      const theDate = weekMenuDate(d.wd, weekShift);
      const isToday = theDate.toDateString() === todayStr;
      const closed = !isDateOrderable(theDate);
      const dateStr = `${theDate.getDate()} ${t("months")[theDate.getMonth()]} ${theDate.getFullYear()}`;
      const dishesHtml = items.length ? items.map((it, idx) => {
        const disabled = closed || it.available === false;
        const label = (it.type === "veg" ? "🌿 " : "🍽️ ") + (lang === "fr" ? it.name_fr : (it.name_en || it.name_fr));
        // Employé avec repas offert ou entièrement pris en charge : on n'affiche aucun prix
        const priceHtml = (b2eIsFree() || b2eHidePrices())
          ? ""
          : `<span class="dd-price">${money(it.price)}</span>`;
        return `<button class="day-dish" ${disabled ? "disabled" : `onclick="closeAll();openDailyDish('${d.key}',${idx},${weekShift})"`}>
          <img class="dd-photo" src="${dailyRowPhoto(it)}" alt="" loading="lazy" />
          <span class="dd-name">${label}</span>${priceHtml}
        </button>`;
      }).join("") : `<div class="day-badge" style="color:var(--muted)">—</div>`;
      return `
        <div class="day-col${isToday?' today':''}${closed?' closed':''}">
          <div class="day-head">${d.label[lang]}<span class="day-date">${dateStr}</span></div>
          <div class="day-body">
            ${dishesHtml}
            ${closed ? `<div class="day-badge" style="color:var(--muted)">${lang==="fr"?"Commande clôturée":"Ordering closed"}</div>` : ""}
          </div>
        </div>`;
    }).join("");
  }

  // Photo pour une ligne brute daily_menu (champs name_fr / type / image_url)
  function dailyRowPhoto(it) {
    if (it.image_url) return it.image_url;
    const n = ((it.name_fr || "") + " " + (it.name_en || "")).toLowerCase();
    if (/poisson|fish|crevette|prawn/.test(n)) return DISH_PHOTOS.poisson;
    if (/briani|biryani/.test(n)) return DISH_PHOTOS.briani;
    if (/nouille|noodle|mine/.test(n)) return DISH_PHOTOS.mine;
    if (/riz|rice/.test(n)) return DISH_PHOTOS.riz;
    if (it.type === "veg") return DISH_PHOTOS.veg;
    return DISH_PHOTOS.poulet;
  }

  // Photo d'un plat du jour : la vraie (uploadée par l'admin) sinon une générique selon le nom/type
  function dailyPhoto(item) {
    if (item.image_url) return item.image_url;
    const n = (item.name.fr + " " + (item.name.en || "")).toLowerCase();
    if (/poisson|fish|crevette|prawn/.test(n)) return DISH_PHOTOS.poisson;
    if (/briani|biryani/.test(n)) return DISH_PHOTOS.briani;
    if (/nouille|noodle|mine/.test(n)) return DISH_PHOTOS.mine;
    if (/riz|rice/.test(n)) return DISH_PHOTOS.riz;
    if (item.type === "veg") return DISH_PHOTOS.veg;
    return DISH_PHOTOS.poulet;
  }
  function openDailyDish(dayKey, idx, weekShift) {
    if (weekShift == null) weekShift = (weekView != null ? weekView : defaultWeekShift());

    const name = { fr: it.name_fr, en: it.name_en || it.name_fr };
    dish = { daily: true, dayKey, item: { id: "daily-" + dayKey + "-" + it.type, name, price: Number(it.price), ingredients: it.ingredients, allergens: it.allergens, type: it.type, image_url: it.image_url }, qty: 1, fromCategory: false };

  /* ============================================================
     FORMULES (plat + boisson)
  ============================================================ */
  function formulaPool(kind) { return kind === "drinks" ? DRINKS : CATEGORIES.filter(c => !c.weekly && !c.fridayOnly).flatMap(c => c.items); }
  function findMenuItem(id) {
    for (const c of CATEGORIES) { const it = c.items.find(i => i.id === id); if (it) return it; }
    return DRINKS.find(d => d.id === id);
  }
  function formulaSeparate(def, sel) {
    return def.slots.reduce((s, slot) => s + (findMenuItem(sel[slot.key])?.price || 0), 0);
  }
  function formulaTotal(def, sel) { return Math.max(0, formulaSeparate(def, sel) - (def.discount || 0)); }

  function renderFormulas() {
    const el = $("#formulasBand");
    if (!el) return;
    el.innerHTML = FORMULAS.map(f => {

    const def = FORMULAS.find(f => f.id === id);

        ${b2ePerItemContrib()?`<div class="r b2e-line"><span>${t("co_b2e_contribution")}</span><b>−${money(contrib)}</b></div>`:""}

  // Contribution employeur estimée sur un prix "à partir de" (aperçu par carte).
  // Le calcul qui fait foi reste côté serveur au paiement.
  function b2eContributionFor(price) {
    if (!b2eSession.active || !b2eSession.rules.length) return 0;
    const rule = b2eSession.rules[0];
    const raw = rule.mode === "percent" ? price * (rule.percent || 0) / 100 : Math.min(rule.amount || 0, price);
    const cap = b2eMonthlyCap();
    const capped = cap != null ? Math.max(0, Math.min(raw, cap - b2eSession.budgetUsed)) : raw;
    return Math.round(capped);
  }

    // cfg.items : { [itemId]: quantité } — sélection multiple, une quantité par pain
    cfg = { items: {}, drinks: {}, condiments: {}, day: null };
    if (currentCat.items.length === 1) cfg.items[currentCat.items[0].id] = 1;
    DRINKS.forEach(d => cfg.drinks[d.id] = 0);
    CONDIMENTS.forEach(c => cfg.condiments[c.id] = false);
    $("#pmTitle").textContent = currentCat.name[lang];
    renderCategoryBody();
    openModal("#productModal");
  }

  /* ── Fiche détaillée d'un plat (photo générique + description) ──
     Photo : si un visuel a été chargé via l'admin (item.img), on le garde ;
     sinon on choisit une photo générique selon le type de plat. */
  const DISH_PHOTOS = {
    poulet:  "./sandwich-nonveg.jpg",
    poisson: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=800&q=80",
    mine:    "https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=800&q=80",
    riz:     "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=800&q=80",
    briani:  "https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=800&q=80",
    veg:     "./sandwich-vege.jpg",
  };
  function dishPhoto(item, cat) {
    if (item.img) return item.img;
    const n = (item.name.fr + " " + item.name.en).toLowerCase();
    if (n.includes("poisson")) return DISH_PHOTOS.poisson;
    if (/poulet|satay|roti|saucisse/.test(n)) return DISH_PHOTOS.poulet;
    if (n.includes("mine")) return DISH_PHOTOS.mine;
    if (n.includes("riz")) return DISH_PHOTOS.riz;
    if (cat.id === "briani") return DISH_PHOTOS.briani;
    if (cat.diet === "veg") return DISH_PHOTOS.veg;
    return cat.img;
  }
  function dishDesc(item, cat) {
    if (item.desc) return item.desc[lang] || item.desc.fr;
    return lang === "fr"
      ? `${item.name.fr} — garniture préparée maison, servie dans notre pain artisanal et livrée fraîche à Moka.`
      : `${item.name.en} — homemade filling, served in our artisan bread and delivered fresh in Moka.`;
  }

  let dish = null; // plat actuellement affiché dans la fiche détaillée
  function openDish(catId, itemId) {
    const cat = CATEGORIES.find(c => c.id === catId);
    const item = cat?.items.find(i => i.id === itemId);
    if (!item) return;
    const fromCategory = $("#productModal").classList.contains("open");
    dish = { catId, item, cat, qty: 1, fromCategory };
    // On masque la liste pendant l'affichage de la fiche (rendu propre, un seul modal visible)
    if (fromCategory) $("#productModal").classList.remove("open");
    $("#dishTitle").textContent = item.name[lang];
    renderDishBody();
    openModal("#dishModal");
  }
  function renderDishBody() {
    const { item, cat, qty, daily } = dish;
    const photo = daily ? dailyPhoto(item) : dishPhoto(item, cat);
    const desc = daily ? (item.ingredients || (lang === "fr" ? "Plat du jour, préparé maison." : "Dish of the day, homemade.")) : dishDesc(item, cat);
    const allergensHtml = daily && item.allergens ? `<div style="margin-top:8px;font-size:13px;color:var(--danger);font-weight:600;">⚠ ${lang==="fr"?"Allergènes":"Allergens"} : ${item.allergens}</div>` : "";
    const contrib = b2ePerItemContrib() ? b2eContributionFor(item.price) : 0;
    const youPay = item.price - contrib;
    const priceHtml = b2ePerItemContrib()
      ? `<div style="margin:14px 0;">
           <span style="text-decoration:line-through;color:var(--muted);font-weight:600;">${money(item.price)}</span>
           <span class="b2e-line" style="font-weight:700;margin-left:8px;">−${money(contrib)}</span>
           <div style="font-family:'Rubik';font-weight:800;font-size:22px;margin-top:2px;">${t("b2e_banner_you_pay")} ${money(youPay)}</div>
         </div>`
      : b2eHidePrices()
      ? `<div style="margin:14px 0;"><span class="b2e-free-tag" style="font-size:15px;">${t("b2e_covered_tag")}</span></div>`
      : b2eIsFree()
      ? `<div style="margin:14px 0;"><span style="font-family:'Rubik';font-weight:800;font-size:22px;">${money(item.price)}</span></div>`
      : `<div style="font-family:'Rubik';font-weight:800;font-size:22px;margin:14px 0;">${money(item.price)}</div>`;
    $("#dishBody").innerHTML = `
      <img src="${photo}" alt="${item.name[lang]}" style="width:100%;height:220px;object-fit:cover;border-radius:12px;" />
      <h3 style="font-family:'Rubik';font-weight:800;font-size:20px;margin-top:16px;">${item.name[lang]}</h3>
      <p style="color:var(--muted);margin-top:6px;">${desc}</p>
      ${allergensHtml}
      ${priceHtml}
      <div class="opt-group">
        <label class="gl">${t("pm_qty")}</label>
        <div class="stepper" style="margin-top:6px;">
          <button onclick="stepDishQty(-1)">−</button>
          <span class="q" id="q_dish" style="font-size:18px;">${qty}</span>
          <button onclick="stepDishQty(1)">+</button>
        </div>
      </div>
      <div class="opt-group">
        <label class="gl">${t("co_day_t")}</label>
        <div style="margin-top:6px;">${daySelectHtml(item.id, "dishDay", dish.day, "updateDishButton()")}</div>
      </div>`;
    updateDishButton();
  }
  // Ferme uniquement la fiche détaillée ; si elle a été ouverte au-dessus de la
  // liste (carte de commande), on y revient au lieu de tout fermer.
  function closeDish() {
    $("#dishModal").classList.remove("open");
    $("#dishModal").scrollTop = 0;
    if (dish?.fromCategory) {
      $("#productModal").classList.add("open"); // retour à la liste
    } else {
      closeAll();
    }
  }
  function stepDishQty(d) { dish.qty = Math.max(1, dish.qty + d); $("#q_dish").textContent = dish.qty; updateDishButton(); }
  function updateDishButton() {
    const btn = $("#dishAdd");
    const day = readDaySelect("dishDay");
    btn.disabled = !day;
    btn.textContent = !day ? t("choose_day") : (b2eHidePrices() ? t("pm_add") : `${t("pm_add")} · ${money(dish.item.price * dish.qty)}`);
  }
  function addDishToCart() {
    const { item, cat, qty, daily } = dish;
    const day = readDaySelect("dishDay");
    if (!day) { alert(lang === "fr" ? "Choisissez d'abord un jour de livraison." : "Please choose a delivery day first."); return; }
    cart.push({
      uid: Date.now() + "_" + Math.floor(Math.random()*9999),
      pid: item.id, name: item.name, img: daily ? dailyPhoto(item) : dishPhoto(item, cat),
      base: item.price, qty, sides: [], drinks: [], day,
      lineTotal: item.price * qty
    });
    saveCart();
    closeAll();
    openCart();
  }

  function renderCategoryBody() {
    const c = currentCat;
    const drinkRow = (item) => `
      <div class="opt-row">
        <div style="display:flex;align-items:center;gap:10px;"><span class="opt-ic">${optEmoji(item.id, item.name)}</span><div><span class="label">${item.name[lang]}</span> <span class="op">+${money(item.price)}</span></div></div>
        <div class="stepper">
          <button onclick="stepOpt('drinks','${item.id}',-1)">−</button>
          <span class="q" id="q_drinks_${item.id}">${cfg.drinks[item.id]}</span>
          <button onclick="stepOpt('drinks','${item.id}',1)">+</button>
        </div>
      </div>`;
    $("#pmBody").innerHTML = `
      <div class="opt-group">
        <label class="gl">${t("pm_choose")}</label>
        <div class="hint">${t("pm_choose_h")}</div>
        <div class="item-list">
          ${c.items.map(item => {
            const on = cfg.items[item.id] != null;
            return `
            <label class="item-opt${on?" selected":""}" onclick="toggleItem('${item.id}')">
              <input type="checkbox" value="${item.id}" ${on?"checked":""} />
              <img class="it-thumb" src="${dishPhoto(item, c)}" alt="" onclick="event.preventDefault();event.stopPropagation();openDish('${c.id}','${item.id}')" style="cursor:pointer" />
              <span class="it it-clickable" onclick="event.preventDefault();event.stopPropagation();openDish('${c.id}','${item.id}')">${item.name[lang]}${item.bestseller ? ` <span class="bs-badge">★ ${t("bestseller")}</span>` : ""}</span>
              <span class="ip">${money(item.price)}</span>
              <div class="item-qty" id="iq_${item.id}" style="${on?"":"display:none;"}" onclick="event.stopPropagation()">
                <div class="stepper sm">
                  <button type="button" onclick="stepItem('${item.id}',-1)">−</button>
                  <span class="q" id="q_item_${item.id}">${cfg.items[item.id] || 1}</span>
                  <button type="button" onclick="stepItem('${item.id}',1)">+</button>
                </div>
              </div>
            </label>`;
          }).join("")}
        </div>
      </div>
      <div class="opt-group">
        <label class="gl">${t("co_day_t")}</label>
        <div style="margin-top:6px;">${daySelectHtml(c.items[0].id, "catDay", cfg.day, "updatePmButton()")}</div>
      </div>
      <div class="opt-group">
        <label class="gl">${t("pm_drinks_t")}</label>
        <div class="hint">${t("pm_drinks_h")}</div>
        ${DRINKS.map(d => drinkRow(d)).join("")}
      </div>
      ${CONDIMENTS.length ? `
      <div class="opt-group">
        <label class="gl">${t("pm_condiments_t")}</label>
        <div class="hint">${t("pm_condiments_h")}</div>
        ${CONDIMENTS.map(cd => `
          <label class="cond-row">
            <input type="checkbox" ${cfg.condiments[cd.id]?"checked":""} onchange="toggleCondiment('${cd.id}')" />
            <span class="opt-ic">${optEmoji(cd.id, cd.name)}</span>
            <span class="label">${cd.name[lang]}</span>
            ${cd.price>0?`<span class="op">+${money(cd.price)}</span>`:`<span class="op" style="color:var(--green-ok)">${lang==="fr"?"offert":"free"}</span>`}
          </label>`).join("")}
      </div>` : ""}`;
    updatePmButton();
  }

  function toggleCondiment(id) { cfg.condiments[id] = !cfg.condiments[id]; updatePmButton(); }

  // Coche/décoche un pain ; quantité par défaut 1 à la sélection
  function toggleItem(id) {
    const row = document.querySelector(`.item-opt input[value="${id}"]`)?.closest(".item-opt");
    const qtyBox = document.getElementById(`iq_${id}`);
    if (cfg.items[id] != null) {
      delete cfg.items[id];
      if (row) { row.classList.remove("selected"); row.querySelector("input").checked = false; }
      if (qtyBox) qtyBox.style.display = "none";
    } else {
      cfg.items[id] = 1;
      if (row) { row.classList.add("selected"); row.querySelector("input").checked = true; }
      if (qtyBox) { qtyBox.style.display = ""; const q = document.getElementById(`q_item_${id}`); if (q) q.textContent = 1; }
    }
    updatePmButton();
  }
  // Quantité d'un pain donné (min 1 ; passer sous 1 le retire)
  function stepItem(id, d) {
    const next = (cfg.items[id] || 1) + d;
    if (next < 1) { toggleItem(id); return; }
    cfg.items[id] = Math.min(9, next);
    const q = document.getElementById(`q_item_${id}`); if (q) q.textContent = cfg.items[id];
    updatePmButton();
  }
  function stepOpt(kind, id, d) {
    cfg[kind][id] = Math.max(0, Math.min(9, cfg[kind][id] + d));
    $(`#q_${kind}_${id}`).textContent = cfg[kind][id];
    updatePmButton();
  }

  // Extras (boissons + condiments) ajoutés une seule fois à la commande
  function extrasTotal() {
    let extras = 0;
    DRINKS.forEach(d => extras += cfg.drinks[d.id] * d.price);
    CONDIMENTS.forEach(c => { if (cfg.condiments[c.id]) extras += c.price; });
    return extras;
  }
  function configLineTotal() {
    let total = extrasTotal();
    for (const id in cfg.items) {
      const item = currentCat.items.find(i => i.id === id);
      if (item) total += item.price * cfg.items[id];
    }
    return total;
  }

  function updatePmButton() {
    const btn = $("#pmAdd");
    const day = readDaySelect("catDay");
    const hasItems = Object.keys(cfg.items).length > 0;
    btn.disabled = !hasItems || !day;
    btn.textContent = !hasItems
      ? t("pm_choose_first")
      : (!day ? t("choose_day") : (b2eHidePrices() ? t("pm_add") : `${t("pm_add")} · ${money(configLineTotal())}`));
  }

  function addConfiguredToCart() {
    const ids = Object.keys(cfg.items);
    if (!ids.length) return;
    const day = readDaySelect("catDay");
    if (!day) { alert(lang === "fr" ? "Choisissez d'abord un jour de livraison." : "Please choose a delivery day first."); return; }
    // Boissons/condiments : rattachés à la 1re ligne (une seule fois pour la commande)
    const drinks = DRINKS.filter(d => cfg.drinks[d.id] > 0).map(d => ({ id: d.id, name: d.name, qty: cfg.drinks[d.id], price: d.price }));
    const condiments = CONDIMENTS.filter(c => cfg.condiments[c.id]).map(c => ({ id: c.id, name: c.name, price: c.price }));
    const stamp = Date.now();
    ids.forEach((id, idx) => {
      const item = currentCat.items.find(i => i.id === id);
      if (!item) return;
      const qty = cfg.items[id];
      const lineDrinks = idx === 0 ? drinks : [];
      const lineConds  = idx === 0 ? condiments : [];
      const extras = idx === 0 ? extrasTotal() : 0;
      cart.push({
        uid: stamp + "_" + idx + "_" + Math.floor(Math.random()*9999),
        pid: id, name: item.name, img: item.img || currentCat.img,
        base: item.price, qty, sides: [], drinks: lineDrinks, condiments: lineConds, day,
        lineTotal: item.price * qty + extras
      });
    });
    saveCart();
    closeAll();
    openCart();
  }

  /* ============================================================
     CART
  ============================================================ */
  function saveCart() { localStorage.setItem("bp_cart", JSON.stringify(cart)); updateCartCount(); }
  function updateCartCount() {
    const n = cart.reduce((s, i) => s + i.qty, 0);
    const el = $("#cartCount");
    el.textContent = n; el.classList.toggle("hidden", n === 0);
  }
  function cartSubtotal() { return cart.reduce((s, i) => s + i.lineTotal, 0); }

  // Disponibilité par jour des plats. Un plat sans restriction est disponible tous les jours.
  // Une catégorie peut définir fridayOnly (=vendredi) ou availableDays: ["lun","mar",...].
  const WD_KEY = { dim: 0, lun: 1, mar: 2, mer: 3, jeu: 4, ven: 5, sam: 6 };
  function itemAllowedWeekdays(pid) {
    // Plat du jour : "daily-<jour>-<type>" → livrable uniquement ce jour de la semaine
    if (typeof pid === "string" && pid.startsWith("daily-")) {
      const wd = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5 }[pid.split("-")[1]];
      return wd ? [wd] : null;
    }
    const cat = CATEGORIES.find(c => c.items.some(i => i.id === pid));
    if (!cat) return null;
    if (cat.fridayOnly) return [5];
    if (cat.availableDays) return cat.availableDays.map(k => WD_KEY[k]);
    return null; // tous les jours
  }
  // Jours (numéros JS) autorisés pour l'ensemble du panier (intersection). null = aucun blocage.
  function cartAllowedWeekdays() {
    let allowed = null;
    for (const line of cart) {
      const wd = itemAllowedWeekdays(line.pid);
      if (wd) allowed = allowed ? allowed.filter(x => wd.includes(x)) : wd.slice();
    }
    return allowed;
  }
  function dayAllowedForCart(ts) { const a = cartAllowedWeekdays(); return !a || a.includes(new Date(ts).getDay()); }

  /* ── Livraison PAR LIGNE (parcours particulier : plusieurs jours dans un même panier) ── */
  function allowedDaysForLine(line) {
    const wd = itemAllowedWeekdays(line.pid); // null = tous les jours ouvrés
    return availableDays().filter(d => !wd || wd.includes(d.getDay()));
  }
  // Attribue à chaque ligne un jour de livraison valide (1er dispo) si absent/invalide
  function ensureLineDays() {
    let changed = false;
    cart.forEach(l => {
      const days = allowedDaysForLine(l);
      if (!days.length) { if (l.day !== null) { l.day = null; changed = true; } return; }
      if (!l.day || !days.some(d => d.getTime() === l.day)) { l.day = days[0].getTime(); changed = true; }
    });
    if (changed) saveCart();
  }
  function setLineDay(uid, ts) { const l = cart.find(i => i.uid === uid); if (l) { l.day = +ts; saveCart(); renderCart(); } }
  // Sélecteur de jour de livraison affiché DANS la fiche d'un article (au moment de l'ajout)
  function daySelectHtml(pid, elId, current, onChange) {
    const days = allowedDaysForLine({ pid });
    if (!days.length) return `<div class="ci-day-none">${lang==="fr"?"Aucun jour disponible (délai dépassé)":"No day available (deadline passed)"}</div>`;
    // Un seul jour possible (plat du jour) → fixé automatiquement
    if (days.length === 1) {
      const ts = days[0].getTime();
      return `<select id="${elId}" class="ci-day-sel" disabled style="font-size:14px;padding:8px 12px;">
        <option value="${ts}" selected>${dayLabelShort(ts)}</option>
      </select><input type="hidden" id="${elId}_fixed" value="${ts}">`;
    }
    // Plusieurs jours → choix OBLIGATOIRE, aucun jour pré-sélectionné
    const cur = (current && days.some(d => d.getTime() === current)) ? current : "";
    return `<select id="${elId}" class="ci-day-sel${cur===""?" needs-day":""}" ${onChange?`onchange="${onChange}"`:""} style="font-size:14px;padding:8px 12px;">
      <option value="" ${cur===""?"selected":""} disabled hidden>${lang==="fr"?"— Choisir un jour —":"— Choose a day —"}</option>
      ${days.map(d => `<option value="${d.getTime()}" ${cur===d.getTime()?"selected":""}>${dayLabelShort(d.getTime())}</option>`).join("")}
    </select>`;
  }
  function readDaySelect(elId) {
    const sel = document.getElementById(elId);
    if (sel && sel.value) return +sel.value;
    const hid = document.getElementById(elId + "_fixed");
    return hid ? +hid.value : null;
  }
  function dayLabelShort(ts) { const d = new Date(+ts); return `${t("days")[d.getDay()]} ${d.getDate()} ${t("months")[d.getMonth()]} ${d.getFullYear()}`; }
  // Récapitulatif du panier groupé par jour de livraison → [{ts, label, lines:[]}]
  function cartByDay() {
    const groups = {};
    cart.forEach(l => { const k = l.day || 0; (groups[k] = groups[k] || []).push(l); });
    return Object.keys(groups).map(k => ({ ts: +k, label: +k ? dayLabelShort(+k) : (lang === "fr" ? "À définir" : "To be set"), lines: groups[k] }))
      .sort((a, b) => a.ts - b.ts);
  }

  function extrasLabel(item) {
    const parts = [...item.sides, ...item.drinks].map(x => `${x.qty}× ${x.name[lang]}`)
      .concat((item.condiments || []).map(x => x.name[lang]));
    return parts.length ? `${t("cart_with")} ${parts.join(", ")}` : "";
  }

  function renderCart() {
    const body = $("#cartBody"), foot = $("#cartFoot");
    if (!cart.length) {
      body.innerHTML = `<div class="cart-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        <p>${t("cart_empty")}</p></div>`;
      foot.innerHTML = "";
      return;
    }
    // Chaque ligne porte son jour de livraison → panier groupé par jour
    ensureLineDays();
    const covered = b2eCoveredUids();
    const lineHtml = (item) => {
      // Contenu du prix : « pris en charge » si entièrement couvert ; vide si repas offert du jour ; sinon le prix
      const priceInner = b2eHidePrices()
        ? `<span class="b2e-free-tag">${t("b2e_covered_tag")}</span>`
        : (covered.has(item.uid) ? "" : money(item.lineTotal));
      return `
      <div class="cart-line">
        <img src="${item.img}" alt="" />
        <div class="ci-main">
          <div class="ci-title">${item.qty}× ${item.name[lang]}</div>
          ${extrasLabel(item) ? `<div class="ci-extras">${extrasLabel(item)}</div>` : ""}
          <div class="ci-bottom">
            <span class="ci-price">${priceInner}</span>
            <button class="ci-edit" onclick="editLine('${item.uid}')">${t("cart_edit")}</button>
            <button class="ci-remove" onclick="removeLine('${item.uid}')">${t("cart_remove")}</button>
          </div>
        </div>
      </div>`;
    };
    body.innerHTML = cartByDay().map(g => `
      <div class="cart-day-group">
        <div class="cart-day-head">📅 ${g.label}${g.ts ? "" : ` <span style="color:var(--danger);font-weight:700;">(${lang==="fr"?"délai dépassé":"deadline passed"})</span>`}</div>
        ${g.lines.map(lineHtml).join("")}
      </div>`).join("");
    foot.innerHTML = `
      <div style="padding:0 0 12px">
        <button class="btn btn-ghost btn-block" onclick="closeAll();setTimeout(()=>document.getElementById('menudujour').scrollIntoView({behavior:'smooth'}),300)">${lang==="fr"?"+ Ajouter des plats":"+ Add more dishes"}</button>
      </div>
      ${b2eHidePrices() ? `
      <div class="totals grand"><span>${t("b2e_covered_line")}</span><span class="b2e-line">✓</span></div>` :
      b2eIsFree() ? (function(){
        // Repas offert : on n'affiche ni sous-total ni ligne « pris en charge » (le prix du plat offert reste masqué),
        // seulement ce que l'employé paie pour d'éventuels plats en plus.
        const pay = Math.max(0, cartSubtotal() - b2eFreeItemValue());
        return `
      <div class="totals grand"><span>${t("b2e_banner_you_pay")}</span><span>${money(pay)}</span></div>`;
      })() : `
      <div class="totals"><span>${t("cart_subtotal")}</span><span>${money(cartSubtotal())}</span></div>
      <div class="totals"><span>${t("cart_delivery")}</span><span>${t("cart_delivery_free")}</span></div>
      <div class="totals grand"><span>${t("cart_total")}</span><span>${money(cartSubtotal())}</span></div>`}
      <button class="btn btn-primary btn-block" onclick="goCheckout()">${t("cart_checkout")}</button>`;
  }

  function removeLine(uid) { cart = cart.filter(i => i.uid !== uid); saveCart(); renderCart(); }

  // « Modifier » : retire la ligne et rouvre la section d'origine de l'article
  function editLine(uid) {
    const line = cart.find(i => i.uid === uid);
    if (!line) return;
    cart = cart.filter(i => i.uid !== uid); saveCart();
    const pid = line.pid || "";
    closeAll();
    if (pid.startsWith("formula-")) { openFormula(pid.replace("formula-", "")); return; }
    if (pid.startsWith("daily-")) {
      const [, day, type] = pid.split("-");
      const shift = line.day ? shiftForWeekKey(mondayKeyOfDate(new Date(line.day))) : defaultWeekShift();
      const idx = (menuForWeek(shift)[day] || []).findIndex(x => x.type === type);
      if (idx >= 0) openDailyDish(day, idx, shift); else openWeekMenu();
      return;
    }
    const cat = CATEGORIES.find(c => c.items.some(i => i.id === pid));
    if (cat) openCategory(cat.id);
    else setTimeout(() => document.getElementById("menu").scrollIntoView({ behavior: "smooth" }), 200);
  }

  /* ============================================================
     B2B
  ============================================================ */
  const B2B_DAILY_CAP = 150; // Plafond ticket-resto : 150 Rs par employé par jour

  function employeeAmount() {
    if (!b2b.valid) return cartSubtotal();
    const rawSubsidy = Math.round(cartSubtotal() * b2b.subsidyPct / 100);
    const cappedSubsidy = Math.min(rawSubsidy, B2B_DAILY_CAP);
    return cartSubtotal() - cappedSubsidy;
  }
  function subsidyAmount() { return cartSubtotal() - employeeAmount(); }

      if (error || !data?.length) { err.classList.add("show"); }

     B2E — avantage employé (compte + détection entreprise)
  ============================================================ */
  async function initB2ESession() {
    if (!_supa || localStorage.getItem("bp_b2e_active") !== "1") return;
    const { data: { session } } = await _supa.auth.getSession();
    if (!session) { localStorage.removeItem("bp_b2e_active"); return; }

    let { data: employee, error } = await _supa
      .from("employees")
      .select("*, companies(id, name, benefit_mode, show_prices), company_offices(id, name, delivery_slot)")
      .eq("id", session.user.id)
      .single();
    if (error) {
      // colonne benefit_mode pas encore ajoutée en base : on retombe sans elle
      ({ data: employee, error } = await _supa
        .from("employees")
        .select("*, companies(id, name), company_offices(id, name, delivery_slot)")
        .eq("id", session.user.id)
        .single());
    }
    if (error || !employee || employee.status === "removed") { localStorage.removeItem("bp_b2e_active"); if (employee?.status === "removed") await _supa.auth.signOut(); return; }

    const { data: rules } = await _supa
      .from("contribution_rules")
      .select("*")
      .eq("company_id", employee.company_id)
      .eq("active", true)
      .order("priority", { ascending: false });

    const periodMonth = new Date();
    const periodStr = `${periodMonth.getFullYear()}-${String(periodMonth.getMonth() + 1).padStart(2, "0")}-01`;
    const { data: ledger } = await _supa
      .from("employee_budget_ledger")
      .select("contributed")
      .eq("employee_id", employee.id)
      .eq("period_month", periodStr)
      .maybeSingle();

    b2eSession = {
      active: true,
      employee,
      company: employee.companies,
      office: employee.company_offices,
      benefitMode: employee.companies?.benefit_mode || "contribution",
      showPrices: employee.companies?.show_prices !== false,
      rules: rules || [],
      budgetUsed: ledger?.contributed || 0,
    };
    renderAll();
  }

  /* Mode 1 « repas offert » : l'entreprise prend en charge 1 article/jour (le plus cher), les extras au tarif normal */
  function b2eIsFree() { return b2eSession.active && b2eSession.benefitMode === "free_daily"; }
  // L'entreprise a désactivé l'affichage des prix : cantine 100% prise en charge, aucun prix visible, rien à payer
  function b2eHidePrices() { return b2eSession.active && b2eSession.showPrices === false; }
  // Affiche la contribution par article (barré + « vous payez ») uniquement en mode contribution classique (prix visibles)
  function b2ePerItemContrib() { return b2eSession.active && !b2eIsFree() && !b2eHidePrices(); }
  // Valeur de l'article offert = prix unitaire le plus élevé du panier (1 unité prise en charge)
  // 1 repas offert PAR JOUR : on prend le plat le plus cher de chaque jour, puis on additionne.
  // Le repas offert ne s'applique QU'AU menu de la semaine (plat du jour, pid « daily-… »),
  // pas aux plats du catalogue. Un plat du jour offert par jour de livraison.
  function isDailyMenuLine(l) { return typeof l.pid === "string" && l.pid.startsWith("daily-"); }

  function b2eFreeItemValue() {
    if (!cart.length) return 0;
    const byDay = {};
    cart.filter(isDailyMenuLine).forEach(l => {
      const k = l.day || 0;
      const unit = (l.qty ? Number(l.lineTotal) / l.qty : Number(l.lineTotal)) || 0;
      byDay[k] = Math.max(byDay[k] || 0, unit);
    });
    return Object.values(byDay).reduce((s, v) => s + v, 0);
  }

  // En mode « repas offert », le plat pris en charge chaque jour est le menu de la semaine le plus cher :
  // on renvoie l'uid de la ligne couverte par jour (pour masquer son prix côté panier/checkout).
  function b2eCoveredUids() {
    const set = new Set();
    if (!b2eIsFree() || !cart.length) return set;
    const best = {};
    cart.filter(isDailyMenuLine).forEach(l => {
      const k = l.day || 0;
      const unit = (l.qty ? Number(l.lineTotal) / l.qty : Number(l.lineTotal)) || 0;
      if (!best[k] || unit > best[k].unit) best[k] = { uid: l.uid, unit };
    });
    Object.values(best).forEach(v => set.add(v.uid));
    return set;
  }

  function b2eMonthlyCap() {
    const rule = b2eSession.rules[0];
    return rule?.monthly_cap ?? null;
  }

  // Aperçu affiché au client — le calcul qui compte est fait côté serveur dans /api/place-order
  function b2ePreviewContribution() {
    if (!b2eSession.active || !b2eSession.rules.length) return 0;
    const rule = b2eSession.rules[0];
    const sub = cartSubtotal();
    const raw = rule.mode === "percent" ? sub * (rule.percent || 0) / 100 : Math.min(rule.amount || 0, sub);
    const cap = b2eMonthlyCap();
    return cap != null ? Math.max(0, Math.min(raw, cap - b2eSession.budgetUsed)) : raw;
  }

  // Cutoff : pour être livré un jour J, commander avant 15h la veille — HEURE DE MAURICE (UTC+4).
  const CUTOFF_HOUR = 15;
  const MU_OFFSET_H = 4; // Maurice = UTC+4, pas d'heure d'été
  // "Maintenant" à Maurice, lisible via les getters locaux (getDay/getDate/getHours = valeurs Maurice)
  function mtNow() { const d = new Date(); return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + MU_OFFSET_H * 3600000); }
  function availableDays() {
    const mt = mtNow();
    const Y = mt.getFullYear(), M = mt.getMonth(), D = mt.getDate();
    const nowMs = Date.now(); // vrai instant UTC
    const days = [];
    for (let i = 1; i < 21 && days.length < 5; i++) {
      const deliv = new Date(Y, M, D + i, 11, 0, 0, 0); // date de livraison (calendrier Maurice)
      const wd = deliv.getDay();
      if (wd === 0 || wd === 6) continue; // pas de livraison le samedi/dimanche
      const veille = new Date(Y, M, D + i - 1);
      // 15h Maurice la veille = (15 - 4)h UTC ce jour-là
      const deadlineMs = Date.UTC(veille.getFullYear(), veille.getMonth(), veille.getDate(), CUTOFF_HOUR - MU_OFFSET_H, 0, 0);
      if (nowMs <= deadlineMs) days.push(deliv);
    }
    return days;
  }
  function isDateOrderable(d) { return availableDays().some(a => a.toDateString() === d.toDateString()); }
  function nextDateForWeekday(wd) {
    const mt = mtNow();
    const Y = mt.getFullYear(), M = mt.getMonth(), D = mt.getDate();
    for (let i = 0; i < 14; i++) { const d = new Date(Y, M, D + i, 11, 0, 0, 0); if (d.getDay() === wd) return d; }
    return null;
  }

          <div class="r b2e-line"><span>${b2eIsFree() ? t("b2e_free_line") + " · " + (b2eSession.company?.name || "") : t("co_b2e_contribution") + " · " + (b2eSession.company?.name || "")}</span><b>−${money(b2eContribution)}</b></div>
          ` : b2b.valid ? `
          <div class="r" style="color:var(--green-ok);"><span>${t("cart_subsidy")} · ${b2b.companyName}</span><b>−${money(subAmt)}</b></div>
          ` : `

          `}
          <div class="r" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;">

            <b>${money(empAmt)}</b>

        </div>
        `}
      </div>`;
    // Pré-remplissage depuis le profil sauvegardé (le client ne saisit qu'une seule fois)
    const _p = getProfile();
    const set = (id, v) => { const el = $(id); if (el && !el.value && v) el.value = v; };

      set("#i_email", _p.email); set("#i_phone", _p.phone);

    if (b2eSession.active && b2eSession.employee) {
      const emp = b2eSession.employee;
      if ($("#i_name") && emp.full_name) $("#i_name").value = emp.full_name;
      if ($("#i_company") && !$("#i_company").value && b2eSession.company?.name) $("#i_company").value = b2eSession.company.name;
      if ($("#i_email") && emp.work_email) $("#i_email").value = emp.work_email;

  async function placeOrder() {
    let ok = true;
    const setErr = (sel, bad) => { $(sel).classList.toggle("invalid", bad); if (bad) ok = false; };
    const name = $("#i_name").value.trim();
    const company = $("#i_company").value.trim();
    const phone = $("#i_phone").value.trim();
    const email = $("#i_email").value.trim();
    const building = $("#i_building").value.trim();
    const town = ($("#i_town")?.value || "Ebène").trim();
    const locality = $("#i_locality").value.trim();
    // Adresse composée pour la commande, l'email et le livreur
    const addr = [building, locality, town].filter(Boolean).join(", ");

    setErr("#f_name", !name);
    setErr("#f_company", !company);
    setErr("#f_phone", !phone);
    setErr("#f_email", !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    setErr("#f_building", !building);

    if (!ok) { $("#checkoutModal").scrollTo({ top: 0, behavior: "smooth" }); return; }

    // Chaque ligne doit avoir un jour de livraison valide (multi-jours)
    ensureLineDays();
    if (cart.some(l => !l.day)) {
      alert(lang === "fr"
        ? "Un plat de votre panier n'a plus de jour de livraison disponible (délai dépassé). Retirez-le ou modifiez-le."
        : "A dish in your cart no longer has an available delivery day (deadline passed). Please remove or edit it.");
      $("#checkoutModal").scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (b2eSession.active) { await placeB2EOrder({ name, company, phone, email, building, town, locality, addr }); return; }

    // Parcours particulier multi-jours : la commande est répartie par jour de livraison
    const groups = cartByDay(); // [{ts, label, lines}]
    const orderNum = checkout.orderNum || makeOrderNumber();
    const daysLabel = groups.map(g => g.label).join(" · ");
    const payLabel = checkout.pay === "juice" ? t("co_pay_juice_t") : t("co_pay_card_t");
    const savedB2b = b2b.valid ? { ...b2b } : null;
    const fullAmt = cartSubtotal();

    // Montant à payer (avec éventuelle subvention B2B appliquée par jour, plafond journalier)
    let payTotal = 0, subTotal = 0;
    const dayCalc = groups.map(g => {
      const dayTotal = g.lines.reduce((s, l) => s + l.lineTotal, 0);
      let daySub = 0;
      if (savedB2b) daySub = Math.min(Math.round(dayTotal * savedB2b.subsidyPct / 100), B2B_DAILY_CAP);
      const dayEmp = dayTotal - daySub;
      payTotal += dayEmp; subTotal += daySub;
      return { ...g, dayTotal, daySub, dayEmp, iso: new Date(g.ts).toISOString().split("T")[0] };
    });
    if (!savedB2b) payTotal = fullAmt;

    // Historique local (une entrée, items portent chacun leur .day)
    const order = { num: orderNum, name, company, phone, email, addr, building, town, locality, days: groups.map(g => ({ day: g.ts, label: g.label })), pay: checkout.pay, items: [...cart], total: payTotal, subtotal: fullAmt, b2b: savedB2b ? { code: savedB2b.code, company: savedB2b.companyName, subsidy: subTotal } : null, createdAt: Date.now() };
    const history = JSON.parse(localStorage.getItem("bp_orders") || "[]");
    history.push(order);
    localStorage.setItem("bp_orders", JSON.stringify(history));

    // Enregistrement Supabase : une ligne par jour de livraison
    if (_supa) {
      const { data: { user } } = await _supa.auth.getUser();
      dayCalc.forEach(g => {
        if (savedB2b) {
          _supa.from("b2b_orders").insert({
            company_id: savedB2b.companyId, employee_name: name, employee_phone: phone,
            order_ref: orderNum, order_items: g.lines, order_total: g.dayTotal,
            subsidy_amount: g.daySub, employee_amount: g.dayEmp,
            delivery_date: g.iso, status: "confirmed"
          }).then(({ error }) => { if (error) console.warn("B2B sync:", error.message); });
        }
        if (user) {
          _supa.from("orders").insert({
            customer_id: user.id, order_ref: orderNum, order_items: g.lines,
            order_total: g.dayTotal, payment_method: checkout.pay,
            delivery_date: g.iso, status: "confirmed"
          }).then(({ error }) => { if (error) console.warn("Account sync:", error.message); });
        }
      });
    }

    // Sauvegarde du profil pour les prochaines visites (saisie une seule fois)
    saveProfile({ name, company, phone, email, addr, building, town, locality, b2bCode: savedB2b?.code || null });

    // Email de confirmation (best-effort)
    fetch("/api/order-email", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to: email, orderRef: orderNum, items: order.items, total: payTotal, deliveryDate: daysLabel, payLabel, name, company, phone, addr, lang }),
    }).catch(() => {});

    cart = []; saveCart();
    b2b  = { code: null, companyId: null, companyName: null, subsidyPct: 50, valid: false };

    renderConfirmation(orderNum, daysLabel, payLabel, payTotal, email, savedB2b, subTotal);
    closeAll();
    openModal("#confirmModal");
  }

  async function placeB2EOrder(info) {
    const { name, company, phone, email: infoEmail, addr, building, town, locality } = info;
    const btn = $("#placeOrderBtn");
    btn.disabled = true;
    btn.textContent = lang === "fr" ? "Envoi de la commande…" : "Placing order…";

    const { data: { session } } = await _supa.auth.getSession();
    const payLabel = checkout.pay === "juice" ? t("co_pay_juice_t") : t("co_pay_card_t");
    const groups = cartByDay(); // une commande B2E par jour de livraison

    let totalPay = 0, totalContribution = 0, firstRef = null, lastPickup = null;
    const errors = [];
    try {
      for (const g of groups) {
        const deliveryDate = new Date(g.ts).toISOString().split("T")[0];
        const res = await fetch("/api/place-order", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({
            items: g.lines,
            deliveryDate,
            paymentMethod: checkout.pay,
            officeId: b2eSession.office?.id || null,
            orderRef: (checkout.orderNum ? checkout.orderNum + "-" + deliveryDate.slice(5).replace("-", "") : null),
            contactName: name, contactPhone: phone, deliveryNote: addr,
          }),
        });
        const payload = await res.json();
        if (!res.ok) { errors.push(`${g.label} : ${payload.error || "erreur"}`); continue; }
        const order = payload.order;
        totalPay += Number(order.employee_amount || 0);
        totalContribution += Number(order.employer_contribution || 0);
        if (!firstRef) firstRef = order.order_ref;
        lastPickup = order.pickup_code;
      }

      if (!firstRef) { // aucun jour n'a réussi
        alert((lang === "fr" ? "Commande impossible :\n" : "Order failed:\n") + errors.join("\n"));
        return;
      }

      saveProfile({ name, company, phone, email: session.user.email, addr, building, town, locality, b2bCode: null });
      b2eSession.budgetUsed += totalContribution;
      cart = []; saveCart();

      const daysLabel = groups.map(g => g.label).join(" · ");
      renderConfirmation(firstRef, daysLabel, payLabel, totalPay, session.user.email,
        { companyName: b2eSession.company?.name }, totalContribution, lastPickup);
      closeAll();
      openModal("#confirmModal");
      if (errors.length) setTimeout(() => alert((lang === "fr" ? "Certains jours n'ont pas pu être commandés :\n" : "Some days could not be ordered:\n") + errors.join("\n")), 400);
    } catch (err) {
      alert(lang === "fr" ? "Erreur lors de la commande. Réessayez." : "Error placing the order. Please retry.");
      console.warn("place-order:", err.message);
    } finally {
      btn.disabled = false;
      renderCheckout();
    }
  }
