<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bondipain | Pain artisanal livré à Moka</title>
  <link rel="icon" type="image/png" id="favicon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    :root {
      --brand:        #F2A24C;
      --brand-strong: #E5892B;
      --brand-deep:   #C9711B;
      --brand-soft:   #FBE5CC;
      --cream:        #FFF8F1;
      --cream-2:      #FDF1E5;
      --ink:          #2A2622;
      --muted:        #837A70;
      --line:         #EFE3D5;
      --green-ok:     #2E7D52;
      --danger:       #C0392B;
      --shadow-sm:    0 2px 10px rgba(60,40,15,.08);
      --shadow-md:    0 8px 30px rgba(60,40,15,.12);
      --radius:       16px;
    }
    body {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      background: var(--cream);
      color: var(--ink);
      overflow-x: hidden;
      line-height: 1.5;
    }
    h1,h2,h3,h4 { font-family: 'Rubik', sans-serif; line-height: 1.1; }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 22px; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 15px;
      padding: 12px 22px; border-radius: 999px; transition: all .18s ease; white-space: nowrap;
    }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--brand-strong); transform: translateY(-1px); }
    .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    .btn-ghost:hover { border-color: var(--brand); color: var(--brand-deep); }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── TOP UTILITY BAR ── */
    .topbar { background: var(--brand); color: #fff; font-size: 13.5px; font-weight: 600; }
    .topbar .container { display: flex; align-items: center; justify-content: center; position: relative; min-height: 38px; gap: 10px; text-align: center; }
    .topbar .promo { display:flex; align-items:center; gap:8px; }
    .lang-switch { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; background: rgba(255,255,255,.22); border-radius: 999px; padding: 3px; }
    .lang-switch button { color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; opacity: .8; }
    .lang-switch button.active { background: #fff; color: var(--brand-deep); opacity: 1; }

    /* ── HEADER ── */
    header.site { position: sticky; top: 0; z-index: 50; background: var(--cream); border-bottom: 1px solid var(--line); transition: box-shadow .2s; }
    header.site.scrolled { box-shadow: var(--shadow-sm); }
    .nav { display: flex; align-items: center; justify-content: space-between; min-height: 74px; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 50px; height: 50px; border-radius: 50%; }
    .brand .name { font-family: 'Rubik'; font-weight: 800; font-size: 22px; color: var(--brand-deep); letter-spacing: -.5px; }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { font-family: 'Rubik'; font-weight: 500; font-size: 15px; color: var(--ink); position: relative; }
    .nav-links a:hover { color: var(--brand-deep); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1.5px solid var(--line); transition: border-color .15s; }
    .icon-btn:hover { border-color: var(--brand); }
    .icon-btn svg { width: 21px; height: 21px; stroke: var(--ink); }
    .cart-count { position: absolute; top: -5px; right: -5px; background: var(--brand-deep); color: #fff; font-size: 11px; font-weight: 800; font-family: 'Rubik'; min-width: 19px; height: 19px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; }
    .menu-toggle { display: none; }

    /* ── HERO ── */
    .hero { position: relative; min-height: 520px; display: grid; place-items: center; text-align: center; color: #fff; overflow: hidden; }
    .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,18,5,.35) 0%, rgba(30,18,5,.55) 100%); z-index: 1; }
    .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-content { position: relative; z-index: 2; padding: 60px 20px; max-width: 760px; }
    .hero .eyebrow { font-family: 'Caveat'; font-size: 30px; color: var(--brand); font-weight: 700; }
    .hero h1 { font-size: clamp(44px, 8vw, 92px); font-weight: 900; letter-spacing: -2px; text-shadow: 0 4px 24px rgba(0,0,0,.4); }
    .hero p.sub { font-size: 19px; margin: 14px auto 28px; max-width: 520px; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
    .hero .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .hero-preview { margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .hero-preview .hp-label { font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; opacity: .9; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .hero-preview .hp-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .hero-preview .hp-chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(4px); color: #fff; font-size: 13.5px; font-weight: 600; padding: 6px 14px; border-radius: 999px; }

    /* ── INFO STRIP ── */
    .info-strip { background: var(--ink); color: #fff; padding: 18px 0; }
    .info-strip .container { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: center; font-size: 14.5px; font-weight: 500; }
    .info-strip svg { width: 26px; height: 26px; stroke: var(--brand); flex-shrink: 0; }

    /* ── SECTION HEADINGS ── */
    section.block { padding: 72px 0; }
    .section-head { text-align: center; max-width: 620px; margin: 0 auto 46px; }
    .section-head .eyebrow { font-family: 'Caveat'; font-size: 26px; color: var(--brand-deep); font-weight: 700; }
    .section-head h2 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -1px; margin-top: 2px; }
    .section-head p { color: var(--muted); margin-top: 12px; font-size: 16px; }

    /* ── MENU CARDS ── */
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
    .card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .card .ph { position: relative; aspect-ratio: 4/3; overflow: hidden; }
    .card .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .card:hover .ph img { transform: scale(1.05); }
    .card .tag { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.95); color: var(--brand-deep); font-family: 'Rubik'; font-weight: 700; font-size: 12px; padding: 5px 12px; border-radius: 999px; }
    .card .body { padding: 20px 20px 22px; display: flex; flex-direction: column; flex: 1; }
    .card h3 { font-size: 22px; font-weight: 700; }
    .card .desc { color: var(--muted); font-size: 14.5px; margin: 8px 0 16px; flex: 1; }
    .card .price-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card .price { font-family: 'Rubik'; font-weight: 800; font-size: 22px; color: var(--ink); }
    .card .avail { font-size: 12.5px; color: var(--muted); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .card .avail .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-ok); }

    /* ── ABOUT ── */
    .about { background: var(--cream-2); }
    .about-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 50px; align-items: center; }
    .about-grid img { border-radius: var(--radius); box-shadow: var(--shadow-md); aspect-ratio: 4/3; object-fit: cover; width: 100%; }
    .about-text h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -1px; }
    .about-text .eyebrow { font-family: 'Caveat'; font-size: 26px; color: var(--brand-deep); font-weight: 700; }
    .about-text p { color: var(--muted); margin-top: 14px; font-size: 16px; }
    .feature-list { list-style: none; margin-top: 22px; display: grid; gap: 14px; }
    .feature-list li { display: flex; gap: 12px; align-items: flex-start; font-weight: 500; }
    .feature-list svg { width: 24px; height: 24px; stroke: var(--brand-deep); flex-shrink: 0; margin-top: 1px; }

    /* ── STEPS ── */
    .steps-infog { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; position: relative; margin-top: 48px; }
    .steps-infog::before { content:""; position:absolute; top:38px; left:12.5%; right:12.5%; height:2px; background: linear-gradient(90deg, var(--brand) 0%, var(--brand-soft) 100%); z-index:0; }
    .step-inf { display:flex; flex-direction:column; align-items:center; text-align:center; padding: 0 16px 32px; position:relative; z-index:1; }
    .step-inf .si-icon { width:76px; height:76px; border-radius:50%; background:var(--brand); display:flex; align-items:center; justify-content:center; margin-bottom:18px; box-shadow:0 4px 18px rgba(242,162,76,.35); }
    .step-inf .si-icon svg { width:34px; height:34px; stroke:#fff; stroke-width:1.8; fill:none; }
    .step-inf .si-num { position:absolute; top:-8px; right:calc(50% - 46px); background:var(--brand-deep); color:#fff; font-family:'Rubik'; font-weight:800; font-size:11px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .step-inf h4 { font-family:'Rubik'; font-weight:700; font-size:16px; margin-bottom:6px; }
    .step-inf p { color:var(--muted); font-size:13.5px; line-height:1.45; }
    @media(max-width:640px){ .steps-infog { grid-template-columns:1fr 1fr; } .steps-infog::before { display:none; } }

    /* ── CONTACT ── */
    .contact { background: var(--ink); color: #fff; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .contact h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
    .contact .eyebrow { font-family: 'Caveat'; font-size: 26px; color: var(--brand); font-weight: 700; }
    .contact p { color: #d8cfc4; margin-top: 12px; }
    .contact-info { display: grid; gap: 16px; margin-top: 8px; }
    .contact-info .row { display: flex; gap: 14px; align-items: center; }
    .contact-info svg { width: 24px; height: 24px; stroke: var(--brand); flex-shrink: 0; }
    .contact-info b { font-family: 'Rubik'; }
    .contact-info span { display: block; color: #c9bfb4; font-size: 14px; }

    /* ── FOOTER ── */
    footer.site { background: #1B1814; color: #cbbfb2; padding: 44px 0 28px; font-size: 14px; }
    .foot-grid { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .foot-grid .brand .name { color: #fff; }
    footer.site .legal { width: 100%; border-top: 1px solid rgba(255,255,255,.1); margin-top: 28px; padding-top: 18px; text-align: center; color: #8c8175; font-size: 13px; }

    /* ── MODAL / DRAWER SYSTEM ── */
    .overlay { position: fixed; inset: 0; background: rgba(25,15,5,.5); backdrop-filter: blur(2px); z-index: 100; opacity: 0; visibility: hidden; transition: opacity .25s; }
    .overlay.open { opacity: 1; visibility: visible; }

    .modal { position: fixed; z-index: 110; left: 50%; top: 50%; transform: translate(-50%, -46%); width: min(560px, 94vw); max-height: 90vh; overflow-y: auto; background: var(--cream); border-radius: 20px; box-shadow: var(--shadow-md); opacity: 0; visibility: hidden; transition: all .25s; }
    .modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
    .modal-head { position: sticky; top: 0; background: var(--cream); padding: 20px 24px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); z-index: 2; }
    .modal-head h3 { font-size: 22px; font-weight: 800; }
    .modal-close { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1.5px solid var(--line); display: grid; place-items: center; }
    .modal-close svg { width: 18px; height: 18px; stroke: var(--ink); }
    .modal-body { padding: 22px 24px; }
    .modal-foot { position: sticky; bottom: 0; background: var(--cream); padding: 16px 24px; border-top: 1px solid var(--line); }

    /* drawer (cart) */
    .drawer { position: fixed; z-index: 110; top: 0; right: 0; height: 100%; width: min(440px, 100vw); background: var(--cream); box-shadow: var(--shadow-md); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s ease; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .drawer-head h3 { font-size: 21px; font-weight: 800; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .drawer-foot { padding: 18px 22px; border-top: 1px solid var(--line); background: var(--cream-2); }

    /* product modal pieces */
    .opt-group { margin-bottom: 22px; }
    .opt-group > label.gl { font-family: 'Rubik'; font-weight: 700; font-size: 15px; display: block; margin-bottom: 4px; }
    .opt-group .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 9px; }
    .opt-row .label { font-weight: 600; }
    .opt-row .op { color: var(--muted); font-size: 13.5px; font-weight: 600; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper button { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-deep); font-weight: 800; font-size: 18px; display: grid; place-items: center; line-height: 1; }
    .stepper button:hover { background: var(--brand); color: #fff; }
    .stepper .q { min-width: 18px; text-align: center; font-family: 'Rubik'; font-weight: 700; }
    .item-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .item-opt { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; transition: all .15s; }
    .item-opt:hover { border-color: var(--brand); }
    .item-opt.selected { border-color: var(--brand); background: var(--brand-soft); }
    .item-opt input[type=radio] { width: 18px; height: 18px; accent-color: var(--brand-strong); flex-shrink: 0; }
    .item-opt .it-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .item-opt .it { flex: 1; font-weight: 600; }
    .item-opt .it-clickable { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .item-opt .it-clickable:hover { color: var(--brand-deep); text-decoration-color: var(--brand); }
    .item-opt .ip { font-family: 'Rubik'; font-weight: 800; color: var(--brand-deep); font-size: 14px; }

    /* cart line */
    .cart-line { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .cart-line img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .cart-line .ci-main { flex: 1; min-width: 0; }
    .cart-line .ci-title { font-family: 'Rubik'; font-weight: 700; font-size: 15.5px; }
    .cart-line .ci-extras { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .cart-line .ci-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .cart-line .ci-price { font-family: 'Rubik'; font-weight: 800; }
    .cart-line .ci-remove { color: var(--danger); font-size: 12.5px; font-weight: 600; }
    .cart-empty { text-align: center; color: var(--muted); padding: 50px 20px; }
    .cart-empty svg { width: 56px; height: 56px; stroke: var(--line); margin: 0 auto 14px; }

    .totals { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 14.5px; color: var(--muted); }
    .totals.grand { font-size: 19px; color: var(--ink); font-family: 'Rubik'; font-weight: 800; margin: 10px 0 16px; }

    /* forms */
    .field { margin-bottom: 16px; }
    .field label { font-family: 'Rubik'; font-weight: 600; font-size: 13.5px; display: block; margin-bottom: 6px; }
    .field input, .field textarea, .field select { width: 100%; font-family: inherit; font-size: 15px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--brand); }
    .field .err { color: var(--danger); font-size: 12.5px; margin-top: 5px; display: none; }
    .field.invalid input, .field.invalid textarea, .field.invalid select { border-color: var(--danger); }
    .field.invalid .err { display: block; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* day picker */
    .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .day-opt { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 12px 6px; text-align: center; transition: all .15s; }
    .day-opt:hover { border-color: var(--brand); }
    .day-opt.selected { border-color: var(--brand); background: var(--brand-soft); }
    .day-opt .dow { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .day-opt .dnum { font-family: 'Rubik'; font-weight: 800; font-size: 22px; margin: 2px 0; }
    .day-opt .mon { font-size: 12px; color: var(--muted); }

    /* payment */
    .pay-opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; margin-bottom: 10px; cursor: pointer; transition: all .15s; }
    .pay-opt.selected { border-color: var(--brand); background: var(--brand-soft); }
    .pay-opt input { margin-top: 3px; accent-color: var(--brand-strong); width: 18px; height: 18px; }
    .pay-opt .pt { font-family: 'Rubik'; font-weight: 700; }
    .pay-opt .pd { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .juice-box { display: none; background: #fff; border: 1.5px dashed var(--brand); border-radius: 12px; padding: 14px; margin: 4px 0 14px; font-size: 14px; }
    .juice-box.show { display: block; }

    /* b2b */
    .b2b-code-row { display: flex; gap: 8px; align-items: flex-start; }
    .b2b-code-row .field { margin: 0; flex: 1; }
    .b2b-success { background: #E8F5E9; border: 1.5px solid #2E7D52; border-radius: 12px; padding: 12px 15px; font-size: 13.5px; color: #2E7D52; display: flex; gap: 10px; align-items: center; }
    .b2b-success svg { width: 18px; height: 18px; stroke: #2E7D52; flex-shrink: 0; }
    .b2b-err { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }
    .b2b-err.show { display: block; }
    .juice-box b { font-family: 'Rubik'; }

    /* b2e */
    .b2e-banner { background: #E8F5E9; border: 1.5px solid #2E7D52; border-radius: var(--radius); padding: 14px 18px; margin: 0 0 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 14px; color: #1E5C38; }
    .b2e-banner b { font-family: 'Rubik'; }
    .b2e-banner .b2e-logout { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--danger); }
    .b2e-line { color: var(--green-ok); }
    .b2e-filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 28px; }
    .b2e-chips { display: flex; gap: 8px; }
    .b2e-chip { font-family: 'Rubik'; font-weight: 700; font-size: 13px; padding: 7px 16px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); color: var(--muted); }
    .b2e-chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .b2e-cutoff { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--brand-deep); }

    .notice { background: var(--brand-soft); border-radius: 12px; padding: 13px 15px; font-size: 13.5px; color: var(--brand-deep); display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; }
    .notice svg { width: 20px; height: 20px; stroke: var(--brand-deep); flex-shrink: 0; margin-top: 1px; }

    /* confirmation */
    .confirm-wrap { text-align: center; padding: 12px 6px 6px; }
    .confirm-check { width: 78px; height: 78px; border-radius: 50%; background: var(--green-ok); display: grid; place-items: center; margin: 0 auto 18px; }
    .confirm-check svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 3; }

  // Contribution employeur estimée sur un prix "à partir de" (aperçu par carte).
  // Le calcul qui fait foi reste côté serveur au paiement.
  function b2eContributionFor(price) {
    if (!b2eSession.active || !b2eSession.rules.length) return 0;
    const rule = b2eSession.rules[0];
    const raw = rule.mode === "percent" ? price * (rule.percent || 0) / 100 : Math.min(rule.amount || 0, price);
    const cap = b2eMonthlyCap();
    const capped = cap != null ? Math.max(0, Math.min(raw, cap - b2eSession.budgetUsed)) : raw;
    return Math.round(capped);
  }

    $("#menuGrid").innerHTML = cats.map(c => {

  };
  function dishPhoto(item, cat) {
    if (item.img) return item.img;
    const n = (item.name.fr + " " + item.name.en).toLowerCase();
    if (n.includes("poisson")) return DISH_PHOTOS.poisson;
    if (/poulet|satay|roti|saucisse/.test(n)) return DISH_PHOTOS.poulet;
    if (n.includes("mine")) return DISH_PHOTOS.mine;
    if (n.includes("riz")) return DISH_PHOTOS.riz;
    if (cat.id === "briani") return DISH_PHOTOS.briani;
    if (cat.diet === "veg") return DISH_PHOTOS.veg;
    return cat.img;
  }
  function dishDesc(item, cat) {
    if (item.desc) return item.desc[lang] || item.desc.fr;
    return lang === "fr"
      ? `${item.name.fr} — garniture préparée maison, servie dans notre pain artisanal et livrée fraîche à Moka.`
      : `${item.name.en} — homemade filling, served in our artisan bread and delivered fresh in Moka.`;
  }

    const cat = CATEGORIES.find(c => c.id === catId);

    const fromCategory = $("#productModal").classList.contains("open");
    dish = { catId, item, cat, qty: 1, fromCategory };
    // On masque la liste pendant l'affichage de la fiche (rendu propre, un seul modal visible)
    if (fromCategory) $("#productModal").classList.remove("open");
    $("#dishTitle").textContent = item.name[lang];
    renderDishBody();
    openModal("#dishModal");
  }

    const priceHtml = b2eSession.active
      ? `<div style="margin:14px 0;">

  // liste (carte de commande), on y revient au lieu de tout fermer.

    $("#dishModal").classList.remove("open");

    $("#dishAdd").textContent = `${t("pm_add")} · ${money(dish.item.price * dish.qty)}`;

  function configLineTotal() {
    if (!cfg.selectedItem) return 0;
    const item = currentCat.items.find(i => i.id === cfg.selectedItem);
    let extras = 0;
    DRINKS.forEach(d => extras += cfg.drinks[d.id] * d.price);
    return (item.price + extras) * cfg.qty;
  }

    const btn = $("#pmAdd");

    const item = currentCat.items.find(i => i.id === cfg.selectedItem);
    const drinks = DRINKS.filter(d => cfg.drinks[d.id] > 0).map(d => ({ id: d.id, name: d.name, qty: cfg.drinks[d.id], price: d.price }));

      uid: Date.now() + "_" + Math.floor(Math.random()*9999),

  /* ============================================================
     B2B
  ============================================================ */
  const B2B_DAILY_CAP = 150; // Plafond ticket-resto : 150 Rs par employé par jour

  function employeeAmount() {
    if (!b2b.valid) return cartSubtotal();
    const rawSubsidy = Math.round(cartSubtotal() * b2b.subsidyPct / 100);
    const cappedSubsidy = Math.min(rawSubsidy, B2B_DAILY_CAP);
    return cartSubtotal() - cappedSubsidy;
  }
  function subsidyAmount() { return cartSubtotal() - employeeAmount(); }

  async function applyB2BCode() {
    const code = ($("#i_b2b")?.value || "").trim().toUpperCase();
    if (!code) return;
    const btn = $("#b2bApplyBtn");
    const err = $("#b2bErr");
    btn.disabled = true; btn.textContent = "…"; err.classList.remove("show");
    try {
      if (!_supa) throw new Error("no supabase");
      const { data, error } = await _supa.from("companies")
        .select("id,name,subsidy_pct").eq("promo_code", code).eq("active", true).limit(1);
      if (error || !data?.length) { err.classList.add("show"); }
      else {
        b2b = { code, companyId: data[0].id, companyName: data[0].name, subsidyPct: data[0].subsidy_pct, valid: true };
        renderCheckout();
        return;
      }
    } catch(e) { err.classList.add("show"); }
    btn.disabled = false; btn.textContent = t("co_b2b_apply");
  }

  function removeB2BCode() {
    b2b = { code: null, companyId: null, companyName: null, subsidyPct: 50, valid: false };
    renderCheckout();
  }

  /* ============================================================
     B2E — avantage employé (compte + détection entreprise)
  ============================================================ */
  async function initB2ESession() {
    if (!_supa || localStorage.getItem("bp_b2e_active") !== "1") return;
    const { data: { session } } = await _supa.auth.getSession();
    if (!session) { localStorage.removeItem("bp_b2e_active"); return; }

    const { data: employee, error } = await _supa
      .from("employees")
      .select("*, companies(id, name), company_offices(id, name, delivery_slot)")
      .eq("id", session.user.id)
      .single();
    if (error || !employee || employee.status === "removed") { localStorage.removeItem("bp_b2e_active"); if (employee?.status === "removed") await _supa.auth.signOut(); return; }

    const { data: rules } = await _supa
      .from("contribution_rules")
      .select("*")
      .eq("company_id", employee.company_id)
      .eq("active", true)
      .order("priority", { ascending: false });

    const periodMonth = new Date();
    const periodStr = `${periodMonth.getFullYear()}-${String(periodMonth.getMonth() + 1).padStart(2, "0")}-01`;
    const { data: ledger } = await _supa
      .from("employee_budget_ledger")
      .select("contributed")
      .eq("employee_id", employee.id)
      .eq("period_month", periodStr)
      .maybeSingle();

    b2eSession = {
      active: true,
      employee,
      company: employee.companies,
      office: employee.company_offices,
      rules: rules || [],
      budgetUsed: ledger?.contributed || 0,
    };
    renderAll();
  }

  function b2eMonthlyCap() {
    const rule = b2eSession.rules[0];
    return rule?.monthly_cap ?? null;
  }

  // Aperçu affiché au client — le calcul qui compte est fait côté serveur dans /api/place-order
  function b2ePreviewContribution() {
    if (!b2eSession.active || !b2eSession.rules.length) return 0;
    const rule = b2eSession.rules[0];
    const sub = cartSubtotal();
    const raw = rule.mode === "percent" ? sub * (rule.percent || 0) / 100 : Math.min(rule.amount || 0, sub);
    const cap = b2eMonthlyCap();
    return cap != null ? Math.max(0, Math.min(raw, cap - b2eSession.budgetUsed)) : raw;
  }

  function renderB2EBanner() {
    const el = $("#b2eBanner");
    if (!el) return;
    if (!b2eSession.active) { el.innerHTML = ""; return; }
    const cap = b2eMonthlyCap();
    const chip = (val, label) => `<button class="b2e-chip${menuDiet===val?' active':''}" onclick="setMenuDiet('${val}')">${label}</button>`;
    el.innerHTML = `
      <div class="b2e-banner">
        <span>${lang === "fr" ? "Vous commandez avec l'avantage" : "You are ordering with the"} <b>${b2eSession.company?.name || ""}</b></span>
        ${cap != null ? `<span>${money(b2eSession.budgetUsed)} ${t("b2e_banner_budget")} ${money(cap)}</span>` : ""}

    if (_supa) await _supa.auth.signOut();
    localStorage.removeItem("bp_b2e_active");

  ============================================================ */
  function availableDays() {
    const now = new Date();
    const earliest = now.getTime() + 24 * 3600 * 1000; // 24h
    const days = [];
    for (let i = 0; i < 16 && days.length < 7; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 11, 0, 0, 0);
      if (d.getTime() >= earliest) days.push(d);
    }
    return days;
  }

        <label class="pay-opt${checkout.pay==="cash"?" selected":""}" id="pay_cash" onclick="pickPay('cash')">

          <div><div class="pt">${t("co_pay_cash_t")}</div><div class="pd">${t("co_pay_cash_d")}</div></div>
        </label>
        <label class="pay-opt${checkout.pay==="juice"?" selected":""}" id="pay_juice" onclick="pickPay('juice')">
          <input type="radio" name="pay" value="juice" ${checkout.pay==="juice"?"checked":""} />
          <div><div class="pt">${t("co_pay_juice_t")}</div><div class="pd">${t("co_pay_juice_d")}</div></div>
        </label>
        <div class="juice-box${checkout.pay==="juice"?" show":""}" id="juiceBox">${t("co_juice_box")}</div>
        <label class="pay-opt ${checkout.pay==='card'?'selected':''}" onclick="checkout.pay='card';renderCheckout()">
          <input type="radio" name="pay" value="card" ${checkout.pay==='card'?'checked':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="26" height="26"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          <div><div class="pt">${t("co_pay_card_t")}</div><div class="pd">${t("co_pay_card_d")}</div></div>
        </label>
      </div>

      <div class="opt-group">
        <label class="gl">${t("co_summary")}</label>
        <div class="confirm-recap" style="margin-top:8px;">
          <div class="r"><span>${t("cart_subtotal")}</span><b>${money(sub)}</b></div>
          ${b2eSession.active ? `
          <div class="r b2e-line"><span>${t("co_b2e_contribution")} · ${b2eSession.company?.name || ""}</span><b>−${money(b2eContribution)}</b></div>
          ` : b2b.valid ? `
          <div class="r" style="color:var(--green-ok);"><span>${t("cart_subsidy")} · ${b2b.companyName}</span><b>−${money(subAmt)}</b></div>
          ` : `
          <div class="r"><span>${t("cart_delivery")}</span><b>${t("cart_delivery_free")}</b></div>
          `}
          <div class="r" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;">
            <span>${b2eSession.active || b2b.valid ? t("confirm_employee_pays") : t("cart_total")}</span>
            <b>${money(empAmt)}</b>
          </div>
        </div>
      </div>`;
    // Pré-remplissage depuis le profil sauvegardé
    const _p = getProfile();
    if (_p) {
      if ($("#i_name") && !$("#i_name").value) $("#i_name").value = _p.name || "";
      if ($("#i_email") && !$("#i_email").value) $("#i_email").value = _p.email || "";
      if ($("#i_phone") && !$("#i_phone").value) $("#i_phone").value = _p.phone || "";
      if ($("#i_addr") && !$("#i_addr").value) $("#i_addr").value = _p.addr || "";
    }
    $("#placeOrderBtn").textContent = `${t("co_place")} · ${money(empAmt)}`;
  }

  function pickDay(time) {
    checkout.day = time;
    document.querySelectorAll(".day-opt").forEach(b => b.classList.toggle("selected", +b.dataset.time === time));
    $("#dayErrWrap").classList.remove("invalid");
  }
  function pickPay(p) {
    checkout.pay = p;
    renderCheckout();
  }

  async function placeOrder() {
    let ok = true;
    const setErr = (sel, bad) => { $(sel).classList.toggle("invalid", bad); if (bad) ok = false; };
    const name = $("#i_name").value.trim();
    const phone = $("#i_phone").value.trim();
    const email = $("#i_email").value.trim();
    const addr = $("#i_addr").value.trim();
    const moka = $("#i_moka").checked;

    setErr("#f_name", !name);
    setErr("#f_phone", !phone);
    setErr("#f_email", !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    setErr("#f_addr", !addr);
    setErr("#f_moka", !moka);
    if (!checkout.day) { $("#dayErrWrap").classList.add("invalid"); ok = false; }

    if (!ok) { $("#checkoutModal").scrollTo({ top: 0, behavior: "smooth" }); return; }

    if (b2eSession.active) { await placeB2EOrder(name, phone, addr, moka); return; }

    // Vérification limite 20 repas/jour pour les commandes B2B
    if (b2b.valid && _supa) {
      const btn = $("#placeOrderBtn");
      btn.disabled = true;
      btn.textContent = lang === "fr" ? "Vérification…" : "Checking…";
      const delivDate = new Date(checkout.day).toISOString().split("T")[0];
      const { count, error: countErr } = await _supa.from("b2b_orders")
        .select("id", { count: "exact", head: true })
        .eq("company_id", b2b.companyId)
        .eq("delivery_date", delivDate);
      btn.disabled = false;
      renderCheckout();
      if (!countErr && count >= 20) {
        const errEl = $("#b2bErr");
        if (errEl) { errEl.textContent = t("co_b2b_limit"); errEl.classList.add("show"); }
        $("#checkoutModal").scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
    }

    const orderNum = makeOrderNumber();
    const dayDate  = new Date(checkout.day);
    const dayStr   = `${t("days")[dayDate.getDay()]} ${dayDate.getDate()} ${t("months")[dayDate.getMonth()]}`;
    const payLabel = checkout.pay === "cash" ? t("co_pay_cash_t") : checkout.pay === "juice" ? t("co_pay_juice_t") : t("co_pay_card_t");

    // Capture amounts before clearing cart
    const fullAmt  = cartSubtotal();
    const empAmt   = employeeAmount();
    const subAmt   = subsidyAmount();
    const savedB2b = b2b.valid ? { ...b2b } : null;

    const order = { num: orderNum, name, phone, email, addr, day: checkout.day, pay: checkout.pay, items: [...cart], total: empAmt, subtotal: fullAmt, b2b: savedB2b ? { code: savedB2b.code, company: savedB2b.companyName, subsidy: subAmt } : null, createdAt: Date.now() };
    const history = JSON.parse(localStorage.getItem("bp_orders") || "[]");
    history.push(order);
    localStorage.setItem("bp_orders", JSON.stringify(history));

    // Enregistrement B2B dans Supabase
    if (savedB2b && _supa) {
      _supa.from("b2b_orders").insert({
        company_id: savedB2b.companyId, employee_name: name, employee_phone: phone,
        order_ref: orderNum, order_items: cart, order_total: fullAmt,
        subsidy_amount: subAmt, employee_amount: empAmt,
        delivery_date: new Date(checkout.day).toISOString().split("T")[0], status: "confirmed"
      }).then(({ error }) => { if (error) console.warn("B2B sync:", error.message); });
    }

    // Enregistrement dans l'historique du compte client (si connecté via compte.html)
    if (_supa) {
      _supa.auth.getUser().then(({ data: { user } }) => {
        if (!user) return;
        _supa.from("orders").insert({
          customer_id: user.id, order_ref: orderNum, order_items: cart,
          order_total: fullAmt, payment_method: checkout.pay,
          delivery_date: new Date(checkout.day).toISOString().split("T")[0], status: "confirmed"
        }).then(({ error }) => { if (error) console.warn("Account sync:", error.message); });
      });
    }

    // Sauvegarde du profil pour les prochaines visites
    saveProfile(name, phone, email, addr, savedB2b?.code || null);

    cart = []; saveCart();
    b2b  = { code: null, companyId: null, companyName: null, subsidyPct: 50, valid: false };

    renderConfirmation(orderNum, dayStr, payLabel, empAmt, email, savedB2b, subAmt);
    closeAll();
    openModal("#confirmModal");
  }

  async function placeB2EOrder(name, phone, addr, moka) {
    const btn = $("#placeOrderBtn");
    btn.disabled = true;
    btn.textContent = lang === "fr" ? "Envoi de la commande…" : "Placing order…";

    const dayDate = new Date(checkout.day);
    const deliveryDate = dayDate.toISOString().split("T")[0];
    const { data: { session } } = await _supa.auth.getSession();

    try {
      const res = await fetch("/api/place-order", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({
          items: cart,
          deliveryDate,
          paymentMethod: checkout.pay,
          officeId: b2eSession.office?.id || null,
        }),
      });
      const payload = await res.json();
      if (!res.ok) throw new Error(payload.error || "Erreur");

      const order = payload.order;
      const dayStr = `${t("days")[dayDate.getDay()]} ${dayDate.getDate()} ${t("months")[dayDate.getMonth()]}`;
      const payLabel = checkout.pay === "cash" ? t("co_pay_cash_t") : checkout.pay === "juice" ? t("co_pay_juice_t") : t("co_pay_card_t");

      saveProfile(name, phone, session.user.email, addr, null);
      cart = []; saveCart();
      b2eSession.budgetUsed += Number(order.employer_contribution || 0);

      renderConfirmation(order.order_ref, dayStr, payLabel, order.employee_amount, session.user.email,
        { companyName: b2eSession.company?.name }, order.employer_contribution, order.pickup_code);
      closeAll();
      openModal("#confirmModal");
    } catch (err) {
      alert(lang === "fr" ? "Erreur lors de la commande. Réessayez." : "Error placing the order. Please retry.");
      console.warn("place-order:", err.message);
    } finally {
      btn.disabled = false;
      renderCheckout();
    }
  }

  function makeOrderNumber() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    const rand = Math.floor(1000 + Math.random() * 9000);
    return `BP-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${rand}`;
  }

  function renderConfirmation(num, dayStr, payLabel, total, email, savedB2b, subAmt, pickupCode) {
    $("#confirmBody").innerHTML = `
      <div class="confirm-wrap">
        <div class="confirm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h3>${t("confirm_title")}</h3>
        <p style="color:var(--muted);margin-top:8px;">${t("confirm_msg")}</p>
        <div class="ordernum">${num}</div>
        ${pickupCode ? `<div class="ordernum" style="font-size:15px;color:var(--green-ok);">${lang === "fr" ? "Code de retrait" : "Pickup code"} : ${pickupCode}</div>` : ""}
        <div class="confirm-recap">
          <div class="r"><span>${t("confirm_for")}</span><b>${dayStr} · 11h–14h</b></div>
          <div class="r"><span>${t("confirm_pay")}</span><b>${payLabel}</b></div>
          ${savedB2b ? `
          <div class="r"><span>${t("confirm_b2b")}</span><b>${savedB2b.companyName}</b></div>
          <div class="r" style="color:var(--green-ok);"><span>${t("cart_subsidy")} · ${savedB2b.companyName}</span><b>−${money(subAmt)}</b></div>
          ` : ""}
          <div class="r" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;">
            <span>${savedB2b ? t("confirm_employee_pays") : t("confirm_total")}</span><b>${money(total)}</b>
          </div>
          <div class="r"><span>Email</span><b>${email}</b></div>
        </div>
        <p style="color:var(--muted);font-size:13px;margin-top:14px;">${t("confirm_email_note")}</p>
      </div>`;
  }

  /* ============================================================
     MODAL / DRAWER CONTROLS
  ============================================================ */
  function openModal(sel) { $("#overlay").classList.add("open"); $(sel).classList.add("open"); document.body.style.overflow = "hidden"; }
  function openCart() { renderCart(); $("#overlay").classList.add("open"); $("#cartDrawer").classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeDrawerOnly() { $("#cartDrawer").classList.remove("open"); }
  function closeAll() {
    $("#overlay").classList.remove("open");
    document.querySelectorAll(".modal, .drawer").forEach(m => m.classList.remove("open"));
    document.body.style.overflow = "";
  }
  function toggleMobileNav(open) {
    $("#mobileNav").classList.toggle("open", open);
    document.body.style.overflow = open ? "hidden" : "";
  }

  window.addEventListener("scroll", () => {
    $("#header").classList.toggle("scrolled", window.scrollY > 10);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeAll(); toggleMobileNav(false); } });

  /* ============================================================
     DETAIL MODAL
  ============================================================ */
  function openDetail(id) {
    const cat = CATEGORIES.find(c => c.id === id);
    if (!cat) return;
    const fillingsHtml = cat.items.map(item => `
      <div class="dp-fill">
        <div>${item.name[lang]}</div>
        <div class="price">${money(item.price)}</div>
      </div>`).join("");
    $("#detailPanel").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span class="dp-tag">${cat.tag[lang]}</span>
        <button onclick="closeDetail()" style="font-size:22px;color:var(--muted);line-height:1">×</button>
      </div>
      <img class="dp-img" src="${cat.img}" alt="${cat.name[lang]}">
      <h2>${cat.name[lang]}</h2>
      <p class="dp-desc">${cat.desc[lang]}</p>
      <h4 style="font-size:15px;font-weight:700;margin-bottom:12px;font-family:'Rubik'">${lang==="fr"?"Nos recettes disponibles":"Available recipes"} (${cat.items.length})</h4>
      <div class="dp-fillings">${fillingsHtml}</div>
      <button class="btn btn-primary btn-block" onclick="closeDetail();openCategory('${cat.id}')">${t("choose")} ${cat.name[lang]}</button>`;
    $("#detailModal").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeDetail() {
    $("#detailModal").classList.remove("open");
    document.body.style.overflow = "";
  }

  /* ============================================================
     PROFIL CLIENT
  ============================================================ */
  const PROFILE_KEY = "bp_profile";

  function saveProfile(name, phone, email, addr, b2bCode) {
    const data = { name, phone, email, addr, b2bCode: b2bCode || null, savedAt: new Date().toISOString() };
    localStorage.setItem(PROFILE_KEY, JSON.stringify(data));
    const btns = [$("#profileBtn"), $("#mobileProfileBtn")];
    btns.forEach(b => { if (b) b.style.display = ""; });
  }

  function getProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch { return null; }
  }

  function initProfile() {
    const p = getProfile();
    if (!p) return;
    const btns = [$("#profileBtn"), $("#mobileProfileBtn")];
    btns.forEach(b => { if (b) b.style.display = ""; });
  }

  function openProfile() {
    const p = getProfile();
    if (!p) return;
    renderProfilePanel(p);
    $("#profileModal").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeProfile() {
    $("#profileModal").classList.remove("open");
    document.body.style.overflow = "";
  }

  function clearProfile() {
    if (!confirm(lang === "fr" ? "Effacer toutes vos données locales ?" : "Clear all your local data?")) return;
    localStorage.removeItem(PROFILE_KEY);
    localStorage.removeItem("bp_orders");
    closeProfile();
    [$("#profileBtn"), $("#mobileProfileBtn")].forEach(b => { if (b) b.style.display = "none"; });
  }

  function reuseB2BCode(code) {
    closeProfile();
    setTimeout(() => {
      openModal("#checkoutModal");
      setTimeout(() => {
        const inp = $("#i_b2b");
        if (inp) { inp.value = code; applyB2BCode(); }
      }, 350);
    }, 300);
  }

  function getMonthOrders() {
    try {
      const all = JSON.parse(localStorage.getItem("bp_orders") || "[]");
      const now = new Date();
      return all.filter(o => {
        const d = new Date(o.createdAt);
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      }).reverse();
    } catch { return []; }
  }

  function renderProfilePanel(p) {
    const firstName = (p.name || "").split(" ")[0];
    const initials = (p.name || "?").split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
    const orders = getMonthOrders();
    const monthName = new Date().toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { month: "long", year: "numeric" });

    const ordersHtml = orders.length === 0
      ? `<p style="color:var(--muted);font-size:14px;padding:8px 0">${t("prof_no_orders")}</p>`
      : orders.map(o => {
          const d = new Date(o.day);
          const dateStr = d.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { weekday:"short", day:"numeric", month:"short" });
          const itemsStr = (o.items || []).slice(0,2).map(i => i.name || i.item || JSON.stringify(i)).join(", ") + (o.items?.length > 2 ? "…" : "");
          return `<div class="order-hist-item">
            <div class="oh-ref">${o.num}</div>
            <div class="oh-date">${dateStr} · ${o.pay || ""}</div>
            <div class="oh-items">${itemsStr}</div>
            <div class="oh-total">${money(o.total)}${o.b2b ? ` <span class="oh-b2b">· ${o.b2b.company} −${money(o.b2b.subsidy)}</span>` : ""}</div>
          </div>`;
        }).join("");

    const b2bHtml = p.b2bCode ? `
      <div class="profile-section">
        <h4>${t("prof_b2b_saved")}</h4>
        <div class="profile-b2b-chip">
          <div>
            <div class="chip-code">${p.b2bCode}</div>
            <div class="chip-label">${lang === "fr" ? "Subvention repas · jusqu'à Rs 150" : "Meal subsidy · up to Rs 150"}</div>
          </div>
          <button class="btn btn-primary" style="padding:8px 16px;font-size:13px" onclick="reuseB2BCode('${p.b2bCode}')">${t("prof_reuse")}</button>
        </div>
      </div>` : "";

    $("#profilePanel").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
        <div>
          <div class="profile-avatar">${initials}</div>
          <h2 style="font-size:22px;font-weight:800">${t("prof_hello")}, ${firstName} 👋</h2>
        </div>
        <button onclick="closeProfile()" style="font-size:26px;color:var(--muted);line-height:1;margin-top:4px">×</button>
      </div>

      <div class="profile-section">
        <h4>${t("prof_info")}</h4>
        <div class="profile-row"><span class="label">${lang==="fr"?"Nom":"Name"}</span><span class="value">${p.name}</span></div>
        <div class="profile-row"><span class="label">Email</span><span class="value">${p.email}</span></div>
        <div class="profile-row"><span class="label">${lang==="fr"?"Téléphone":"Phone"}</span><span class="value">${p.phone}</span></div>
        <div class="profile-row"><span class="label">${lang==="fr"?"Adresse":"Address"}</span><span class="value">${p.addr}</span></div>
      </div>

      ${b2bHtml}

      <div class="profile-section">
        <h4>${t("prof_orders_month")} — ${monthName}</h4>
        ${ordersHtml}
      </div>

      <button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--danger);border-color:var(--danger)" onclick="clearProfile()">${t("prof_clear")}</button>
    `;
  }

  /* ============================================================
     CATALOGUE DYNAMIQUE — prix, noms et photos synchronisés depuis
     Supabase (panneau admin.html). Si la table "products" est
     injoignable, les valeurs codées en dur ci-dessus restent utilisées.
  ============================================================ */
  async function syncPricesFromSupabase() {
    if (!_supa) return;
    const { data, error } = await _supa.from("products").select("id, price, active, name_fr, name_en, image_url");
    if (error || !data) return;
    const byId = Object.fromEntries(data.map(p => [p.id, p]));

    const applyOverrides = (item) => {
      const o = byId[item.id];
      if (!o) return;
      item.price = o.price;
      if (o.name_fr) item.name.fr = o.name_fr;
      if (o.name_en) item.name.en = o.name_en;
      if (o.image_url) item.img = o.image_url;
    };

    // Items not present in the table (not yet migrated) keep their hardcoded
    // name/price/photo and stay visible. Items present but inactive are hidden.
    CATEGORIES.forEach(c => {
      c.items = c.items.filter(i => !byId[i.id] || byId[i.id].active);
      c.items.forEach(applyOverrides);
      if (c.items.length) c.from = Math.min(...c.items.map(i => i.price));
    });
    DRINKS.forEach(applyOverrides);
  }

  /* ============================================================
     INIT
  ============================================================ */
  syncPricesFromSupabase().finally(renderAll);
  initProfile();
  initB2ESession();

  /* ============================================================
     POPUP PROMO
  ============================================================ */
  function initPromo() {
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem("bp_promo_seen") === today) return;
    const endOfMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0);
    const endStr = endOfMonth.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { day: "numeric", month: "long" });
    $("#promoWelcome").textContent  = t("promo_welcome");
    $("#promoBadge").textContent    = lang === "fr" ? "Offre de lancement" : "Launch offer";
    $("#promoDesc").textContent     = t("promo_until") + " " + endStr + " — " + t("promo_offer") + ".";
    $("#promoCta").textContent      = t("promo_cta");
    $("#promoSkip").textContent     = t("promo_skip");
    setTimeout(() => $("#promoPopup").classList.add("open"), 1800);
  }

  function closePromo() {
    $("#promoPopup").classList.remove("open");
    const today = new Date().toISOString().slice(0, 10);
    localStorage.setItem("bp_promo_seen", today);
  }

  initPromo();
  </script>

  <div class="profile-modal" id="profileModal">
    <div class="profile-overlay" onclick="closeProfile()"></div>
    <div class="profile-panel" id="profilePanel"></div>
  </div>

  <div class="promo-popup" id="promoPopup">
    <div class="promo-overlay" onclick="closePromo()"></div>
    <div class="promo-box">
      <button class="promo-close" onclick="closePromo()">×</button>
      <div class="promo-header">
        <div class="promo-badge" id="promoBadge">Offre de lancement</div>
        <div class="promo-pct"><span>-</span>50<span>%</span></div>
        <h3 id="promoWelcome"></h3>
      </div>
      <div class="promo-body">
        <p id="promoDesc"></p>
        <a href="#menu" class="btn btn-primary btn-block" onclick="closePromo()" id="promoCta"></a>
        <button class="btn btn-ghost btn-block" onclick="closePromo()" id="promoSkip" style="margin-top:10px;font-size:13px;color:var(--muted)"></button>
      </div>
    </div>
  </div>
</body>
