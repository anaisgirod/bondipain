  /* ============================================================
     CATALOGUE DYNAMIQUE — prix, noms et photos synchronisés depuis
     Supabase (panneau admin.html). Si la table "products" est
     injoignable, les valeurs codées en dur ci-dessus restent utilisées.
  ============================================================ */
  async function syncPricesFromSupabase() {
    if (!_supa) return;
    let { data, error } = await _supa.from("products").select("id, price, active, name_fr, name_en, image_url, bestseller");
    if (error) {
      // colonne bestseller pas encore ajoutée en base : on retombe sur les champs de base
      ({ data, error } = await _supa.from("products").select("id, price, active, name_fr, name_en, image_url"));
    }
    if (error || !data) return;
    const byId = Object.fromEntries(data.map(p => [p.id, p]));

    const applyOverrides = (item) => {
      const o = byId[item.id];
      if (!o) return;
      item.price = o.price;
      if (o.name_fr) item.name.fr = o.name_fr;
      if (o.name_en) item.name.en = o.name_en;
      if (o.image_url) item.img = o.image_url;
      item.bestseller = !!o.bestseller;
    };

    // Items not present in the table (not yet migrated) keep their hardcoded
    // name/price/photo and stay visible. Items present but inactive are hidden.
    CATEGORIES.forEach(c => {
      c.items = c.items.filter(i => !byId[i.id] || byId[i.id].active);
      c.items.forEach(applyOverrides);
      if (c.items.length) c.from = Math.min(...c.items.map(i => i.price));
    });
    DRINKS.forEach(applyOverrides);
  }

  // Catégories spéciales (menu du jour / vendredi) — conservées quel que soit le catalogue en base
  const CATALOG_SPECIAL = CATEGORIES.filter(c => c.weekly || c.fridayOnly);

  // Catalogue « Nos plats » piloté par la base (menu_categories + products).
  // Si des catégories existent en base, elles remplacent le catalogue codé en dur.
  async function loadCatalogFromDB() {
    if (!_supa) return false;
    const { data: cats } = await _supa.from("menu_categories").select("*").eq("active", true).order("sort");
    if (!cats || !cats.length) return false; // pas encore migré → on garde le catalogue par défaut
    let { data: prods } = await _supa.from("products")
      .select("id, price, active, name_fr, name_en, image_url, bestseller, category_id, desc_fr, desc_en, sort");
    prods = prods || [];
    const built = cats.map(c => {
      const items = prods
        .filter(p => p.category_id === c.id && p.active !== false)
        .sort((a, b) => (a.sort || 0) - (b.sort || 0))
        .map(p => ({
          id: p.id,
          name: { fr: p.name_fr || p.id, en: p.name_en || p.name_fr || p.id },
          price: Number(p.price) || 0,
          img: p.image_url || c.img,
          desc: (p.desc_fr || p.desc_en) ? { fr: p.desc_fr || p.desc_en, en: p.desc_en || p.desc_fr } : null,
          bestseller: !!p.bestseller,
        }));
      return {
        id: c.id,
        name: { fr: c.name_fr || c.id, en: c.name_en || c.name_fr || c.id },
        desc: { fr: c.desc_fr || "", en: c.desc_en || c.desc_fr || "" },
        tag: { fr: c.tag_fr || "", en: c.tag_en || c.tag_fr || "" },
        img: c.img || "",
        diet: c.diet || "mixed",
        items,
        from: items.length ? Math.min(...items.map(i => i.price)) : 0,
      };
    }).filter(c => c.items.length);
    CATEGORIES.length = 0;
    CATEGORIES.push(...built, ...CATALOG_SPECIAL);
    return true;
  }

  /* ============================================================
     INIT
  ============================================================ */
  // Contenu éditable depuis l'admin (site_content) — surcharge les textes par défaut
  const EDITABLE_KEYS = ["topbar","hero_eyebrow","hero_title","hero_sub","hero_cta","hero_cta_b2e","info_strip","about_eyebrow","about_title","about_p1","about_p2","contact_eyebrow","contact_title","contact_p","footer_tag","steps_eyebrow","steps_title","b2e_free_banner","b2e_covered_banner","b2e_banner_budget"];
  async function loadSiteContent() {
    if (!_supa) return;
    const { data, error } = await _supa.from("site_content").select("key, fr, en");
    if (error || !data) return;
    let uiFont = "", uiScale = "";
    for (const row of data) {
      if (row.key === "ui_font")       { uiFont = row.fr || "";  continue; }
      if (row.key === "ui_font_scale") { uiScale = row.fr || ""; continue; }
      // Infographie « 4 étapes » : clés stepN_title / stepN_sub → surcharge du tableau STEPS
      const stepM = row.key.match(/^step([1-4])_(title|sub)$/);
      if (stepM) {
        const i = parseInt(stepM[1], 10) - 1, slot = stepM[2] === "title" ? 0 : 1;
        if (STEPS[i]) {
          if (row.fr) STEPS[i].fr[slot] = row.fr;
          if (row.en) STEPS[i].en[slot] = row.en;
        }
        continue;
      }
      if (row.key === "about_features") {
        if (row.fr) ABOUT_FEATURES.fr = row.fr.split("\n").map(s => s.trim()).filter(Boolean);
        if (row.en) ABOUT_FEATURES.en = row.en.split("\n").map(s => s.trim()).filter(Boolean);
        continue;
      }
      if (row.key === "popup_enabled") { WELCOME.enabled = (row.fr === "1"); continue; }
      if (row.key === "popup_title") { WELCOME.title.fr = row.fr || ""; WELCOME.title.en = row.en || ""; continue; }
      if (row.key === "popup_body")  { WELCOME.body.fr = row.fr || "";  WELCOME.body.en = row.en || "";  continue; }
      if (!EDITABLE_KEYS.includes(row.key)) continue;
      if (row.fr) I18N.fr[row.key] = row.fr;
      if (row.en) I18N.en[row.key] = row.en;
    }
    applyUiTheme(uiFont, uiScale);
  }

  // Applique la police + la taille choisies dans l'admin, à tout le site.
  // Par défaut (vide/100) : aucun changement, on garde le design Barlow/Rubik.
  function applyUiTheme(font, scale) {
    const GOOGLE = {
      "Montserrat": "Montserrat:wght@400;500;600;700;800",
      "Poppins":    "Poppins:wght@400;500;600;700;800",
      "Roboto":     "Roboto:wght@400;500;700;900",
      "Open Sans":  "Open+Sans:wght@400;600;700;800",
      "Lato":       "Lato:wght@400;700;900",
    };
    let styleEl = document.getElementById("ui-font-override");
    if (font && font.trim()) {
      for (const name in GOOGLE) {
        if (font.includes(name) && !document.getElementById("gf-" + name)) {
          const l = document.createElement("link");
          l.id = "gf-" + name; l.rel = "stylesheet";
          l.href = "https://fonts.googleapis.com/css2?family=" + GOOGLE[name] + "&display=swap";
          document.head.appendChild(l);
        }
      }
      if (!styleEl) { styleEl = document.createElement("style"); styleEl.id = "ui-font-override"; document.head.appendChild(styleEl); }
      styleEl.textContent = `body, body *:not(svg):not(svg *){font-family:${font} !important;}`;
    } else if (styleEl) { styleEl.remove(); }
    const s = Number(scale) || 100;
    document.documentElement.style.zoom = (s && s !== 100) ? (s / 100) : "";
  }

  /* ── POP-UP D'ACCUEIL (éditable dans l'admin) ── */
  const WELCOME = { enabled: false, title: { fr: "", en: "" }, body: { fr: "", en: "" } };
  function maybeShowWelcome() {
    if (!WELCOME.enabled) return;
    if (sessionStorage.getItem("bp_welcome_seen") === "1") return;
    const title = WELCOME.title[lang] || WELCOME.title.fr || "Bienvenue";
    const body  = WELCOME.body[lang]  || WELCOME.body.fr  || "";
    const ov = document.createElement("div");
    ov.className = "welcome-ov";
    ov.innerHTML = `<div class="welcome-card">
      <button class="welcome-x" aria-label="Fermer">&times;</button>
      <div class="welcome-emoji">🥖</div>
      <h3>${title}</h3>
      <p>${body.replace(/\n/g, "<br>")}</p>
      <button class="btn btn-primary welcome-cta">${lang === "fr" ? "C'est parti" : "Let's go"}</button>
    </div>`;
    const close = () => { ov.remove(); sessionStorage.setItem("bp_welcome_seen", "1"); };
    ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
    ov.querySelector(".welcome-x").onclick = close;
    ov.querySelector(".welcome-cta").onclick = close;
    document.body.appendChild(ov);
  }

  /* ── Carrousel du hero (photos qui défilent) ── */
  const HERO_IMAGES = [
    "https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=1600&q=80",
    "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=1600&q=80",
    "https://images.unsplash.com/photo-1539252554453-80ab65ce3586?auto=format&fit=crop&w=1600&q=80",
    "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1600&q=80",
  ];
  let _heroI = 0, _heroTimer = null;
  function heroGo(n) {
    const imgs = document.querySelectorAll("#heroBg img");
    const dots = document.querySelectorAll("#heroDots button");
    if (!imgs.length) return;
    imgs[_heroI]?.classList.remove("active");
    dots[_heroI]?.classList.remove("active");
    _heroI = (n + imgs.length) % imgs.length;
    imgs[_heroI]?.classList.add("active");
    dots[_heroI]?.classList.add("active");
  }
  function heroSet(n) { heroGo(n); restartHeroTimer(); }
  function restartHeroTimer() {
    clearInterval(_heroTimer);
    _heroTimer = setInterval(() => heroGo(_heroI + 1), 5000);
  }
  function initHeroCarousel() {
    const el = $("#heroBg");
    if (!el) return;
    el.innerHTML = HERO_IMAGES.map((src, i) => `<img src="${src}" alt="" class="${i===0?"active":""}" loading="${i===0?"eager":"lazy"}" />`).join("");
    const dotsEl = $("#heroDots");
    if (dotsEl) dotsEl.innerHTML = HERO_IMAGES.map((_, i) => `<button class="${i===0?"active":""}" aria-label="Photo ${i+1}" onclick="heroSet(${i})"></button>`).join("");
    _heroI = 0;
    if (HERO_IMAGES.length > 1) restartHeroTimer();
  }
  initHeroCarousel();

  (async function initCatalog() {
    await loadSiteContent();
    const fromDb = await loadCatalogFromDB();   // catalogue « Nos plats » depuis la base si migré
    if (!fromDb) await syncPricesFromSupabase(); // sinon on applique les prix/photos sur le catalogue par défaut
    renderAll();
    maybeShowWelcome();
  })();
  loadDailyMenu();
  loadCondiments();
  initProfile();
  initB2ESession();
  initB2CIdentity();

  // Client B2C connecté (session Supabase, hors employé) → récupère son prénom pour le header
  async function initB2CIdentity() {
    if (!_supa) return;
    if (localStorage.getItem("bp_b2e_active") === "1") return; // employé : géré par initB2ESession
    const { data: { session } } = await _supa.auth.getSession();
    if (!session) return;
    const { data } = await _supa.from("customers")
      .select("full_name, company, phone, building, town, locality, email")
      .eq("id", session.user.id).maybeSingle();
    if (data) {
      b2cUser = { name: data.full_name || session.user.email, email: data.email || session.user.email, ...data };
      updateAccountLinks();
      if ($("#checkoutModal").classList.contains("open")) renderCheckout();
    }
  }

  /* ============================================================
     POPUP PROMO
  ============================================================ */
  function initPromo() {
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem("bp_promo_seen") === today) return;
    const endOfMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0);
    const endStr = endOfMonth.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { day: "numeric", month: "long" });
    $("#promoWelcome").textContent  = t("promo_welcome");
    $("#promoBadge").textContent    = lang === "fr" ? "Offre de lancement" : "Launch offer";
    $("#promoDesc").textContent     = t("promo_until") + " " + endStr + " — " + t("promo_offer") + ".";
    $("#promoCta").textContent      = t("promo_cta");
    $("#promoSkip").textContent     = t("promo_skip");
    setTimeout(() => $("#promoPopup").classList.add("open"), 1800);
  }

  function closePromo() {
    $("#promoPopup").classList.remove("open");
    const today = new Date().toISOString().slice(0, 10);
    localStorage.setItem("bp_promo_seen", today);
  }

  initPromo();
  </script>

  <div class="profile-modal" id="profileModal">
    <div class="profile-overlay" onclick="closeProfile()"></div>
    <div class="profile-panel" id="profilePanel"></div>
  </div>

  <div class="promo-popup" id="promoPopup">
    <div class="promo-overlay" onclick="closePromo()"></div>
    <div class="promo-box">
      <button class="promo-close" onclick="closePromo()">×</button>
      <div class="promo-header">
        <div class="promo-badge" id="promoBadge">Offre de lancement</div>
        <div class="promo-pct"><span>-</span>50<span>%</span></div>
        <h3 id="promoWelcome"></h3>
      </div>
      <div class="promo-body">
        <p id="promoDesc"></p>
        <a href="#menu" class="btn btn-primary btn-block" onclick="closePromo()" id="promoCta"></a>
        <button class="btn btn-ghost btn-block" onclick="closePromo()" id="promoSkip" style="margin-top:10px;font-size:13px;color:var(--muted)"></button>
      </div>
    </div>
  </div>
</body>
</html>
