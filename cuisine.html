<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bondipain — Opérations cuisine</title>
<link rel="icon" type="image/png" href="./logo-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --brand:#F2A24C; --brand-deep:#C9711B; --brand-soft:#FBE5CC; --cream:#FFF8F1; --cream-2:#FDF1E5;
    --ink:#2A2622; --muted:#837A70; --line:#EFE3D5; --green:#2E7D52; --green-soft:#E8F5E9; --danger:#C0392B;
    --shadow:0 2px 12px rgba(60,40,15,.09); --radius:14px;
  }
  body { font-family:'Barlow',sans-serif; font-weight:500; background:#F5F0EB; color:var(--ink); min-height:100vh; }
  h1,h2,h3,h4 { font-family:'Rubik',sans-serif; }
  .hidden { display:none !important; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; }

  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .login-card { background:#fff; border-radius:20px; box-shadow:var(--shadow); padding:40px 36px; width:100%; max-width:420px; }
  .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .login-logo span { font-family:'Rubik'; font-weight:800; font-size:22px; color:var(--brand-deep); }
  .login-logo .badge { background:var(--ink); color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .field { margin-bottom:16px; }
  .field label { font-family:'Rubik'; font-weight:600; font-size:13px; display:block; margin-bottom:6px; }
  .field input { width:100%; font-family:inherit; font-size:15px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; }
  .field input:focus { outline:none; border-color:var(--brand); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:'Rubik'; font-weight:600; font-size:14px; padding:10px 18px; border-radius:999px; transition:all .18s; }
  .btn-primary { background:var(--brand); color:#fff; } .btn-primary:hover { background:var(--brand-deep); }
  .btn-ghost { background:#fff; border:1.5px solid var(--line); color:var(--ink); } .btn-ghost:hover { border-color:var(--brand); }
  .btn-block { width:100%; }
  .login-err { color:var(--danger); font-size:13px; margin-bottom:12px; display:none; }
  .login-err.show { display:block; }

  .dash-header { background:#fff; border-bottom:1px solid var(--line); padding:0 28px; display:flex; align-items:center; justify-content:space-between; height:66px; }
  .dash-logo { display:flex; align-items:center; gap:10px; }
  .dash-logo span { font-family:'Rubik'; font-weight:800; font-size:20px; color:var(--brand-deep); }
  .dash-logo .badge { background:var(--ink); color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .wrap { max-width:1000px; margin:0 auto; padding:26px 22px 60px; }

  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .toolbar h2 { font-size:20px; font-weight:800; flex:1; }
  .toolbar input[type=date] { font-family:inherit; padding:8px 12px; border:1.5px solid var(--line); border-radius:10px; }

  .route { background:var(--ink); color:#fff; border-radius:var(--radius); padding:16px 20px; margin-bottom:22px; font-size:14.5px; }
  .route b { color:var(--brand); }
  .route .steps { margin-top:8px; font-weight:600; }

  .group { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px; }
  .group-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .group-head h3 { font-size:17px; font-weight:800; }
  .group-head .slot { background:var(--brand-soft); color:var(--brand-deep); font-family:'Rubik'; font-weight:700; font-size:12.5px; padding:4px 12px; border-radius:999px; }
  .lots { background:var(--cream); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .lots .lots-t { font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .lot { display:inline-block; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:4px 12px; margin:3px 4px 0 0; font-size:13.5px; }
  .lot b { color:var(--brand-deep); }
  .ord { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .ord:last-child { border-bottom:none; }
  .ord .emp { font-weight:700; min-width:120px; }
  .ord .meal { flex:1; color:var(--muted); }
  .ord .alg { background:#FBE9E7; color:var(--danger); font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .ord .pk { font-family:'Rubik'; font-weight:800; color:var(--green); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .totline { font-size:14px; color:var(--muted); margin-bottom:16px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><img src="./logo-full.png" alt="Bondipain" style="height:30px;width:auto;" /><span class="badge">Cuisine / Ops</span></div>
    <h2 style="font-size:22px;font-weight:800;margin-bottom:6px;">Opérations cuisine</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:22px;">Réservé à l'équipe Bondipain.</p>
    <div class="login-err" id="loginErr">Accès refusé.</div>
    <div class="field"><label>Email</label><input id="i_email" type="email" placeholder="hello@bondipain.com" autocomplete="email" /></div>
    <div class="field"><label>Mot de passe</label><input id="i_pwd" type="password" autocomplete="current-password" /></div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">Se connecter</button>
    <div style="text-align:center;margin-top:16px;"><a href="index.html" style="color:var(--brand-deep);font-weight:700;font-size:13.5px;">← Accueil</a></div>
  </div>
</div>

<!-- OPS -->
<div id="app" class="hidden">
  <header class="dash-header">
    <div class="dash-logo"><a href="index.html" title="Accueil"><img src="./logo-full.png" alt="Bondipain" style="height:30px;width:auto;" /></a><span class="badge">Cuisine / Ops</span></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <a class="btn btn-ghost" href="index.html">← Accueil</a>
      <button class="btn btn-ghost" onclick="logout()">Déconnexion</button>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <h2>Production du jour</h2>
      <button class="btn btn-ghost" onclick="setDay(0)">Aujourd'hui</button>
      <button class="btn btn-ghost" onclick="setDay(1)">Demain</button>
      <input id="dayPicker" type="date" onchange="loadDay()" />
      <button class="btn btn-primary" onclick="printLabels()">Imprimer les étiquettes</button>
    </div>
    <div class="totline" id="totLine"></div>
    <div id="routeBox"></div>
    <div id="groups"><p class="empty">Chargement…</p></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://cqtplubyjgkhbnlujsoe.supabase.co";
const SUPABASE_ANON="sb_publishable_PBzzpwEQ57cvpsk9adu69Q_KjKhC-Qb";
const _supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const ADMIN_EMAIL = "hello@bondipain.com";
let currentData = null;

function todayStr(offset){ const d=new Date(); d.setDate(d.getDate()+(offset||0)); return d.toISOString().slice(0,10); }

async function doLogin(){
  const email=document.getElementById("i_email").value.trim();
  const pwd=document.getElementById("i_pwd").value;
  const err=document.getElementById("loginErr"); const btn=document.getElementById("loginBtn");
  err.classList.remove("show"); btn.disabled=true; btn.textContent="Connexion…";
  const { data, error } = await _supa.auth.signInWithPassword({ email, password:pwd });
  if(error || !data.session || data.user.email!==ADMIN_EMAIL){
    err.textContent = "Accès réservé à l'équipe Bondipain."; err.classList.add("show");
    btn.disabled=false; btn.textContent="Se connecter";
    if(data?.session) await _supa.auth.signOut();
    return;
  }
  enterApp();
}
async function logout(){ await _supa.auth.signOut(); location.reload(); }

function enterApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("dayPicker").value = todayStr(0);
  loadDay();
}
function setDay(offset){ document.getElementById("dayPicker").value = todayStr(offset); loadDay(); }

async function loadDay(){
  const date = document.getElementById("dayPicker").value || todayStr(0);
  document.getElementById("groups").innerHTML = `<p class="empty">Chargement…</p>`;
  document.getElementById("routeBox").innerHTML = "";
  const { data:{ session } } = await _supa.auth.getSession();
  try {
    const res = await fetch("/api/kitchen-batch?date="+date, { headers:{ Authorization:"Bearer "+session.access_token } });
    const payload = await res.json();
    if(!res.ok) throw new Error(payload.error||"Erreur");
    currentData = payload;
    render(payload);
  } catch(e){
    document.getElementById("groups").innerHTML = `<p class="empty">Erreur : ${e.message}</p>`;
  }
}

function render(data){
  document.getElementById("totLine").textContent = `${data.totalOrders} repas · ${data.groups.length} point(s) de livraison`;
  document.getElementById("routeBox").innerHTML = data.route.length
    ? `<div class="route"><b>Plan de tournée</b><div class="steps">Cuisine → ${data.route.join(" → ")}</div></div>` : "";
  const box = document.getElementById("groups");
  if(!data.groups.length){ box.innerHTML = `<p class="empty">Aucune commande pour cette date.</p>`; return; }
  box.innerHTML = data.groups.map(g=>`
    <div class="group">
      <div class="group-head">
        <h3>${g.office} · ${g.company}</h3>
        <span class="slot">${g.slot} · ${g.total} repas</span>
      </div>
      <div class="lots">
        <div class="lots-t">Lots cuisine</div>
        ${Object.entries(g.mealCounts).map(([n,c])=>`<span class="lot"><b>${c}</b> ${n}</span>`).join("")}
      </div>
      ${g.orders.map(o=>`
        <div class="ord">
          <span class="emp">${o.employee}</span>
          <span class="meal">${o.meal}</span>
          ${(o.allergens||[]).length?`<span class="alg">⚠ ${o.allergens.join(", ")}</span>`:""}
          <span class="pk">${o.pickup_code||""}</span>
        </div>`).join("")}
    </div>`).join("");
}

function printLabels(){
  if(!currentData || !currentData.groups.length){ alert("Aucune commande à imprimer."); return; }
  const labels = [];
  currentData.groups.forEach(g => g.orders.forEach(o => labels.push({ ...o, office:g.office, slot:g.slot })));
  const w = window.open("", "_blank");
  w.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Étiquettes cuisine — ${currentData.date}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;padding:10px;}
    .grid{display:flex;flex-wrap:wrap;gap:8px;}
    .lab{border:1.5px solid #333;border-radius:8px;padding:10px 12px;width:calc(50% - 8px);box-sizing:border-box;}
    .lab .emp{font-size:16px;font-weight:800;} .lab .co{font-size:12px;color:#666;margin-bottom:4px;}
    .lab .meal{font-size:14px;margin:4px 0;} .lab .alg{color:#C0392B;font-weight:700;font-size:12px;}
    .lab .foot{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;}
    .lab .pk{font-weight:800;color:#2E7D52;}
    @media print{ .noprint{display:none;} .lab{page-break-inside:avoid;} }
  </style></head><body>
    <button class="noprint" onclick="window.print()" style="margin:6px 0 14px;padding:9px 18px;background:#F2A24C;color:#fff;border:none;border-radius:999px;font-weight:700;cursor:pointer">Imprimer</button>
    <div class="grid">
    ${labels.map(l=>`<div class="lab">
      <div class="emp">${l.employee}</div>
      <div class="co">${l.company} · ${l.office} · ${l.slot}</div>
      <div class="meal">${l.meal}</div>
      ${(l.allergens||[]).length?`<div class="alg">⚠ Allergènes : ${l.allergens.join(", ")}</div>`:""}
      <div class="foot"><span>${l.order_ref||""}</span><span class="pk">${l.pickup_code||""}</span></div>
    </div>`).join("")}
    </div>
  </body></html>`);
  w.document.close();
}

/* auto-login si déjà admin */
(async function(){
  const { data:{ session } } = await _supa.auth.getSession();
  if(session && session.user.email===ADMIN_EMAIL) enterApp();
})();
</script>
<script src="./pwd-eye.js"></script>
</body>
</html>
