<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bondipain — Nouveau mot de passe</title>
<link rel="icon" type="image/png" href="./logo-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--brand:#FF8C00;--brand-deep:#DA4928;--ink:#2A2622;--muted:#837A70;--line:#EFE3D5;--danger:#C0392B;--green:#2E7D52}
  body{font-family:'Barlow',sans-serif;font-weight:500;background:#F5F0EB;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(60,40,15,.12);padding:38px 34px;width:100%;max-width:420px}
  .brand{text-align:center;margin-bottom:8px}
  .brand img{height:40px}
  h1{font-family:'Rubik';font-weight:800;font-size:22px;margin:14px 0 4px}
  p.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  label{font-family:'Rubik';font-weight:600;font-size:13px;display:block;margin-bottom:6px}
  input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--brand)}
  .btn{width:100%;font-family:'Rubik';font-weight:700;font-size:15px;padding:13px;border-radius:999px;background:var(--brand);color:#fff;border:none;cursor:pointer}
  .btn:hover{background:var(--brand-deep)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:13px;margin-bottom:14px;padding:10px 12px;border-radius:10px;display:none}
  .msg.show{display:block}
  .msg.err{background:#FBE9E7;color:var(--danger)}
  .msg.ok{background:#E8F5E9;color:var(--green)}
  a.back{display:block;text-align:center;margin-top:16px;color:var(--brand-deep);font-weight:700;font-size:13.5px}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W9QR4QJW"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="card">
  <div class="brand"><img src="./logo-full.png" alt="Bondipain" /></div>
  <h1 id="ttl">Nouveau mot de passe</h1>
  <p class="sub" id="sub">Choisissez un nouveau mot de passe pour votre compte.</p>
  <div class="msg" id="msg"></div>
  <form id="form" onsubmit="return doReset(event)">
    <label id="lbl">Nouveau mot de passe</label>
    <input id="pwd" type="password" required minlength="6" autocomplete="new-password" />
    <button class="btn" id="btn" type="submit">Enregistrer</button>
  </form>
  <a class="back" href="compte.html">← Retour à la connexion</a>
</div>
<script src="./pwd-eye.js"></script>
<script>
const SUPABASE_URL="https://cqtplubyjgkhbnlujsoe.supabase.co";
const SUPABASE_ANON="sb_publishable_PBzzpwEQ57cvpsk9adu69Q_KjKhC-Qb";
const _supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const en=(localStorage.getItem("bp_lang")||"fr")==="en";
if(en){document.documentElement.lang="en";document.getElementById("ttl").textContent="New password";document.getElementById("sub").textContent="Choose a new password for your account.";document.getElementById("lbl").textContent="New password";document.getElementById("btn").textContent="Save";document.querySelector("a.back").textContent="← Back to login";}
function show(el,cls,txt){el.className="msg show "+cls;el.textContent=txt;}
// Vérifie qu'un lien de récupération valide a bien ouvert une session
let ready=false;
_supa.auth.onAuthStateChange((event,session)=>{ if(session)ready=true; });
setTimeout(async()=>{ const {data:{session}}=await _supa.auth.getSession(); if(session)ready=true;
  if(!ready){ show(document.getElementById("msg"),"err",en?"Invalid or expired link. Please request a new reset email.":"Lien invalide ou expiré. Redemandez un email de réinitialisation."); } },1200);
async function doReset(evt){
  evt.preventDefault();
  const msg=document.getElementById("msg"),btn=document.getElementById("btn");
  const pwd=document.getElementById("pwd").value;
  btn.disabled=true;
  const {error}=await _supa.auth.updateUser({password:pwd});
  if(error){ show(msg,"err",(en?"Error: ":"Erreur : ")+error.message); btn.disabled=false; return false; }
  show(msg,"ok",en?"Password updated! Redirecting…":"Mot de passe mis à jour ! Redirection…");
  setTimeout(()=>{ window.location.href="compte.html"; },1600);
  return false;
}
</script>
</body>
</html>
