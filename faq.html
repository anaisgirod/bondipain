      { "@type": "Question", "name": "La livraison est-elle payante ?", "acceptedAnswer": { "@type": "Answer", "text": "La livraison est gratuite dans la zone éligible actuelle (Ébène), sauf si des frais différents sont clairement affichés avant validation." } },

      { "@type": "Question", "name": "Gérez-vous les allergènes ?", "acceptedAnswer": { "@type": "Answer", "text": "Les clients allergiques doivent contacter Bondipain avant de commander. Le risque de contamination croisée ne peut être totalement exclu dans une cuisine partagée." } },
      { "@type": "Question", "name": "Comment sont affichés les prix ?", "acceptedAnswer": { "@type": "Answer", "text": "Les prix sont affichés en roupies mauriciennes (Rs), prix final consommateur, incluant tous les frais obligatoires." } },
      { "@type": "Question", "name": "Proposez-vous un avantage repas pour les entreprises ?", "acceptedAnswer": { "@type": "Answer", "text": "Oui. Les entreprises peuvent subventionner les repas de leurs employés via un compte entreprise : l'employé ne paie que son solde au moment de la commande. Rendez-vous sur la page Entreprises." } }

  <style>

  <script>
  const FAQDEF = (window.LEGAL_DEFAULTS && window.LEGAL_DEFAULTS.faq) || { fr:[], en:[] };
  const L = {
    fr: { back:"← Retour au site", eyebrow:"FAQ", pageTitle:"Questions fréquentes",
      sub:"Tout ce qu'il faut savoir sur la commande et la livraison de vos repas Bondipain à Ébène.",
      cta:"Commander maintenant", footLine:"© 2026 Bondipain Signature Ltd", footLegal:"Informations légales",
      items: FAQDEF.fr },
    en: { back:"← Back to site", eyebrow:"FAQ", pageTitle:"Frequently asked questions",
      sub:"Everything you need to know about ordering and delivery of your Bondipain meals in Ébène.",
      cta:"Order now", footLine:"© 2026 Bondipain Signature Ltd", footLegal:"Legal information",
      items: FAQDEF.en }
  };
  let lang = localStorage.getItem("bp_lang") || "fr";
  function stripHtml(s){ const d = document.createElement("div"); d.innerHTML = s; return (d.textContent || "").trim(); }
  function updateJsonLd(){
    // Régénère les données structurées FAQPage à partir des questions FR (pour le SEO)
    try {
      const items = L.fr.items || [];
      const ld = { "@context":"https://schema.org", "@type":"FAQPage", "mainEntity": items.map(([q,a]) => ({ "@type":"Question", "name": stripHtml(q), "acceptedAnswer": { "@type":"Answer", "text": stripHtml(a) } })) };
      let el = document.getElementById("faqLd");
      if (!el) { el = document.createElement("script"); el.type = "application/ld+json"; el.id = "faqLd"; document.head.appendChild(el); }
      el.textContent = JSON.stringify(ld);
    } catch(e){}
  }
  function render(){
    const t = L[lang];
    document.documentElement.lang = lang;
    document.getElementById("backLbl").textContent = t.back;
    document.getElementById("eyebrow").textContent = t.eyebrow;
    document.getElementById("pageTitle").textContent = t.pageTitle;
    document.getElementById("pageSub").textContent = t.sub;
    document.getElementById("ctaBtn").textContent = t.cta;
    document.getElementById("footLine").textContent = t.footLine;
    document.getElementById("footLegal").textContent = t.footLegal;
    document.title = t.pageTitle + " | Bondipain";
    document.getElementById("langToggle").innerHTML = ["fr","en"].map(l =>
      `<button class="${l===lang?'active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
    document.getElementById("faq").innerHTML = t.items.map(([q,a]) =>
      `<details><summary>${q}</summary><div class="a">${a}</div></details>`).join("");
  }
  function setLang(l){ lang = l; localStorage.setItem("bp_lang", l); render(); }
  render();
  // FAQ éditée depuis l'admin (site_content : faq_fr / faq_en en JSON)
  (async function loadFaqOverrides(){
    try {
      if (!window.supabase) return;
      const sb = window.supabase.createClient("https://cqtplubyjgkhbnlujsoe.supabase.co", "sb_publishable_PBzzpwEQ57cvpsk9adu69Q_KjKhC-Qb");
      const { data, error } = await sb.from("site_content").select("key, fr").in("key", ["faq_fr","faq_en"]);
      if (error || !data) return;
      let changed = false;
      for (const row of data) {
        if (!row.fr) continue;
        try { const arr = JSON.parse(row.fr); if (Array.isArray(arr) && arr.length) { L[row.key === "faq_fr" ? "fr" : "en"].items = arr; changed = true; } } catch(e){}
      }
      if (changed) { render(); updateJsonLd(); }
    } catch(e) { /* garde la FAQ par défaut */ }
  })();
  </script>
